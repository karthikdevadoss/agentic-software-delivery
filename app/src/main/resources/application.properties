spring.application.name=customer-app
server.port=${PORT:8080}

# No real Appointment Availability service exists yet (see
# docs/FLAGSHIP_MARKET_COVERAGE.md) -- defaults to this same app's own
# internal synthetic demo provider (see
# integration/appointment/demo/DemoAppointmentProviderController),
# reached over a real HTTP loopback call so the client/timeout/retry/
# circuit-breaker path stays genuine, just with synthetic portfolio data
# on the other end. Point APPOINTMENT_SERVICE_BASE_URL at a real
# downstream service instead once one exists. Tests override this
# property to point at a real WireMock stub.
#
# REAL BUG FOUND AND FIXED (2026-09-14): using ${server.port} here broke
# every @SpringBootTest(webEnvironment=RANDOM_PORT) test that exercises
# this loopback -- server.port resolves to the literal configured value
# ("0" for random-port tests), not the actual bound port, so the client
# was really connecting to "http://localhost:0/...", failing with a real
# ResourceAccessException that the resilience layer honestly (and
# silently) reported as SERVICE_UNAVAILABLE. local.server.port is the
# Spring Boot test framework's own answer to this exact problem: it is
# published into the environment (by ServerPortInfoApplicationContextInitializer,
# auto-registered for RANDOM_PORT tests) once the embedded server has
# actually bound its port, before any regular singleton bean -- including
# this property's own consumer, AppointmentAvailabilityClient -- is created.
appointment.service.base-url=${APPOINTMENT_SERVICE_BASE_URL:http://localhost:${local.server.port:${server.port}}/internal/demo-appointment-provider}

spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Open Session In View is enabled by default in Spring Boot but is a
# well-known anti-pattern (it silently extends the DB transaction/
# connection across the whole HTTP request, including view rendering) --
# disabled here as a deliberate production-correctness fix. Safe in this
# codebase specifically because no entity is serialized with a lazy
# association still unresolved (CustomerPreference/ContractPlan reference
# their owning customer by a plain customerId column, not a JPA
# relationship -- see those entities' class Javadoc).
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL: GraphiQL's own UI page is public for discoverability, same
# reasoning as swagger-ui.html above (a recruiter/consumer must be able
# to see the schema before authenticating) -- POST /graphql itself still
# requires a valid token via the default authenticated() fallback in
# SecurityConfig, and per-customer access is enforced per-field via
# WorkspaceAccessGuard (see CustomerGraphQLController's Javadoc for why
# GraphQL's single endpoint can't be scope-gated the way REST paths are).
spring.graphql.graphiql.enabled=true

# PORTFOLIO DEMO JWT SIGNING SECRET -- for local dev / CI only. This is a
# single-app resource server acting as its own token issuer (see
# security/DemoJwtIssuer.java's Javadoc for why this is explicitly NOT an
# enterprise IdP pattern). Real deployments MUST override via the
# JWT_DEMO_SIGNING_SECRET env var with a securely generated secret that is
# never committed to source control -- see docs/RESOURCE_REGISTRY.md.
app.security.jwt.secret=${JWT_DEMO_SIGNING_SECRET:local-dev-only-insecure-demo-signing-secret-never-use-in-real-production-32-bytes-minimum}
app.security.jwt.issuer=agentic-delivery-customer-app-demo-issuer
app.security.jwt.audience=customer-app
app.security.jwt.demo-token-ttl-seconds=900

# OBSERVABILITY. health/info are public (see SecurityConfig -- standard
# liveness/readiness pattern); everything else under /actuator/** requires
# a valid token (see SecurityConfig), since raw metrics/env can leak
# internal detail a recruiter demo shouldn't need. 100% trace sampling is
# fine at this traffic volume and gives every log line a real
# traceId/spanId for correlation -- no external tracing backend is
# configured or required, this is in-process only (Brave).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.tracing.sampling.probability=1.0
management.observations.key-values.application=customer-app
logging.structured.format.console=ecs

# CACHE (Redis, cache-aside for the active contract plan -- see
# cache/ContractPlanCacheService.java). No production Redis is
# provisioned yet (a deliberate scope decision, not an oversight -- see
# docs/ACTION_QUEUE.json) -- Lettuce connects lazily, so the app starts
# fine regardless, and every cache operation already falls back safely
# to the database. The Redis health indicator is disabled specifically
# because it would otherwise report /actuator/health DOWN for an
# intentionally-absent OPTIONAL dependency, masking real app health --
# re-enable this once Redis is actually provisioned for production.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=false

# EVENTING (Kafka, transactional outbox -- see outbox/OutboxPublisher.java
# and messaging/CustomerPreferenceEventConsumer.java). No production Kafka
# is provisioned yet (a deliberate scope decision, same as Redis above,
# not this session's call to make unilaterally).
#
# REAL PRODUCTION INCIDENT, not a hypothetical (2026-09-14, found by
# inspecting the actual deployed app's own logs, then fixed across three
# escalating attempts): with no broker reachable, "retry connecting in
# the background" turned out to mean Kafka's consumer/AdminClient
# "Rebootstrapping" (re-resolving the bootstrap address list) roughly
# once per second, forever -- to the point Railway itself started
# dropping log messages ("rate limit reached for deployment"). Two
# targeted property fixes were tried and both failed to actually solve
# it: raising spring.kafka.consumer.properties.reconnect.backoff.ms
# governs reconnecting to an already-known broker node, not bootstrap
# re-resolution when NO node has ever been reachable; disabling
# spring.kafka.admin.auto-create stopped the AdminClient's share of the
# noise but not the @KafkaListener consumer's own, independent
# reconnect loop. The actual, working fix is architectural: the entire
# Kafka subsystem (KafkaMessagingConfig, CustomerPreferenceEventConsumer,
# OutboxPublisher) is now conditional on app.kafka.enabled, so nothing
# attempts to connect at all until real infrastructure exists --
# CustomerPreferenceService still writes outbox rows unconditionally
# (the DB write is independent and always correct), they simply
# accumulate unpublished until Kafka is enabled. Set KAFKA_ENABLED=true
# alongside a real KAFKA_BOOTSTRAP_SERVERS once Kafka is provisioned.
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
management.health.kafka.enabled=false

# Flyway is off by default (H2's ddl-auto=create-drop above already owns
# that schema). See application-postgres.properties for the profile that
# turns it on. A single-file multi-document (#--- / on-profile=postgres)
# form was tried here first and genuinely misbehaved in real CI even
# after the real root cause below was fixed -- spring.flyway.enabled=true
# from the postgres-only document leaked into the DEFAULT (no active
# profile) context too, exactly as if `.properties` multi-document
# key overrides were not being scoped by the activation condition the way
# YAML's `---` documents are. Not fully root-caused given the session's
# time budget (see docs/LESSONS.md) -- reverted to genuinely separate
# profile files, which do not have that failure mode by construction
# (a key from one file cannot leak into another file's property source).
spring.flyway.enabled=false
