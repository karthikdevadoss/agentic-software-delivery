spring.application.name=customer-app
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Open Session In View is enabled by default in Spring Boot but is a
# well-known anti-pattern (it silently extends the DB transaction/
# connection across the whole HTTP request, including view rendering) --
# disabled here as a deliberate production-correctness fix. Safe in this
# codebase specifically because no entity is serialized with a lazy
# association still unresolved (CustomerPreference/ContractPlan reference
# their owning customer by a plain customerId column, not a JPA
# relationship -- see those entities' class Javadoc).
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway is off by default (H2's ddl-auto=create-drop above already owns
# that schema) -- the `postgres` document below turns it on.
spring.flyway.enabled=false

# ======================================================================
# PRODUCTION-TARGET PROFILE -- NOT YET ACTIVE (activate with
# SPRING_PROFILES_ACTIVE=postgres once a real Postgres DATABASE_URL is
# provisioned and approved -- see docs/ACTION_QUEUE.json). Flyway owns the
# schema here (ddl-auto=validate, never auto-generate/alter in
# production).
#
# Uses the modern single-file, `spring.config.activate.on-profile`
# multi-document form (the officially recommended mechanism since Spring
# Boot 2.4) rather than a separate application-postgres.properties file --
# a real bug was found and fixed here: with two separate profile files, a
# real GitHub Actions CI run against a genuine Postgres Testcontainers
# instance showed spring.flyway.enabled resolving to false even with the
# postgres profile active (zero Flyway log lines, then
# "Schema validation: missing table [contract_plan]"), contradicting the
# documented "profile-specific file overrides the base file" precedence
# rule. Root cause was not fully isolated given the session's time budget
# (a genuinely fast-moving, version-sensitive area -- see docs/LESSONS.md);
# switching to the single-file multi-document form removes the ambiguity
# entirely rather than trusting unverified cross-file precedence again.
# ======================================================================
#---
spring.config.activate.on-profile=postgres

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/customerdb}
spring.datasource.username=${DATABASE_USERNAME:customer_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
