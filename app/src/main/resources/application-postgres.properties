# PRODUCTION PROFILE -- ACTIVE since 2026-09-14 (see docs/ACTION_QUEUE.json's
# now-resolved FLAGSHIP-POSTGRES-CUTOVER entry): the real, live Railway
# production deployment runs with SPRING_PROFILES_ACTIVE=postgres and a
# real, dedicated Postgres service in the agentic-delivery-customer-app
# project, independently re-verified live via `railway variables`
# (SPRING_PROFILES_ACTIVE/DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD
# all real, non-placeholder values) on 2026-09-18 -- this comment
# previously said "NOT YET ACTIVE" and was stale, corrected here rather
# than left presenting outdated documentation as current runtime truth.
# The H2 profile in application.properties remains the active default for
# LOCAL dev/test only. Flyway owns the schema here (ddl-auto=validate,
# never auto-generate/alter in production).
#
# A genuinely real, previously-unknown root cause was found and fixed
# getting Flyway to actually run at all in this project: Spring Boot 4
# split FlywayAutoConfiguration out of spring-boot-autoconfigure into its
# own module, spring-boot-flyway (exactly like spring-boot-hibernate/
# spring-boot-jdbc/spring-boot-jpa) -- flyway-core + flyway-database-
# postgresql alone are the Flyway LIBRARY, not Spring's autoconfiguration
# for it. Without spring-boot-flyway as an explicit dependency (see
# pom.xml), no property value here could ever have mattered. See
# docs/LESSONS.md for the full diagnostic trail (three real CI failures
# before this was found).

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/customerdb}
spring.datasource.username=${DATABASE_USERNAME:customer_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
