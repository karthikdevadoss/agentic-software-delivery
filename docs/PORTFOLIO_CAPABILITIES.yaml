- id: falsification-preregistered-negative-result
  display_name: 'Pre-registered evaluation that falsified its own product thesis, and the negative result kept intact'
  engineering_problem_solved: Decide whether a multi-model cross-review design actually reduced published false claims, under a decision rule fixed in advance -- then stop the programme when the evidence failed that rule, preserve the mechanical verdict and the human adjudication separately rather than reconciling them, and refuse the four moves (a next sprint, an ablation, a rerun, a harder replacement benchmark) that would each have made the negative result disappear
  technology:
  - pre-registered decision rules and frozen ground truth
  - sealed independent answers across two real model families
  - typed claim comparison (BOOLEAN/ENUM/NUMBER/VERSION only; free text never adjudicated by code)
  - mutation testing of the evaluator itself
  - offline deterministic replay with zero model calls
  - evidence-integrity manifests that refuse re-registration
  business_scenario: Any organisation buying or building an AI assurance claim, where the real risk is that the measurement system is less reliable than the thing it measures
  implementation_state: IMPLEMENTED
  test_state: TESTED
  production_state: NOT_PRODUCTION_PROVISIONED
  evidence_links:
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/docs/DEEP_CONSENSUS_CASE_STUDY.md
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/docs/DEEP_CONSENSUS_FINAL_CLOSURE_2026-10-02.md
  - https://github.com/karthikdevadoss/agentic-software-delivery/tree/master/docs/evidence/deep-consensus-sprint6
  relevant_modules:
  - docs/DEEP_CONSENSUS_CASE_STUDY.md
  - docs/DEEP_CONSENSUS_FINAL_CLOSURE_2026-10-02.md
  - docs/evidence/deep-consensus-sprint6/evidence-integrity-manifest.json
  - docs/evidence/deep-consensus-sprint6/sprint6-selfreplay-report.json
  evidence_note:
  - 'Sprint 6 engineering run: 20 of 20 pre-registered cases run exactly once, 99 subscription turns, 0 paid API calls, evidence integrity 16/16 PASS, mutation gate 19 killed / 0 survived, self-replay reproduces the verdict offline with 0 differences and 0 model calls'
  - 'The strongest finding is about measurement, not the product: 13 defects were found in Sprint 6 alone -- nine in the scorer, two in identity/routing that would have published a FALSE AGREEMENT, one in the entitlement check, two in the artefact detector itself. Sprint 5 produced a manufactured regression and Sprint 6 a manufactured catch, pointing in opposite directions, which rules out evaluator bias and licenses only the conclusion that the measurement system was not yet reliable enough to support the product claim.'
  - 'PRODUCT THESIS UNPROVEN. Genuine baseline material false claims demonstrated: 0. Genuine FALSE -> TRUE catches: 0. Must never be presented as a working accuracy product.'
  interview_topics:
  - why a pre-registered decision rule is worth more than a good result
  - how an evaluator defect manufactures a product headline in either direction
  - why the mechanical verdict and the human adjudication are both preserved and neither rewritten
  - the four moves that make a negative result vanish, and why each was refused
  - assurance systems must validate their evaluators as aggressively as they validate models
  job_market_tags:
  - ai-evaluation
  - experiment-design
  - engineering-judgement
  - llm-assurance
  verification_level: TESTED
