# Portfolio Capability Registry
#
# Machine-readable inventory of real, evidence-backed engineering
# capabilities in this project, used to build job-specific showcases fast
# (see showcases/<slug>/showcase.yaml) without re-deriving the same facts
# from scratch for every application. Every field here must trace to
# docs/PROJECT_STATE.json's completed_capabilities/verification_state, or
# to real, currently-runnable code — nothing here is aspirational.
#
# Workflow this registry supports (see the "Fast future JD workflow" note
# at the bottom): JD -> extract requirements -> map each to a capability_id
# below -> classify STRONGLY_DEMONSTRATED / PRESENT_BUT_SHOWCASE_WEAK /
# IMPORTANT_MISSING / NOT_WORTH_ADDING -> build a showcase manifest.

