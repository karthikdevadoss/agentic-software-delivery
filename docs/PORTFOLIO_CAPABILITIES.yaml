  engineering_problem_solved: Answer real interview questions as the candidate from private career material only -- a grounding threshold, a first-sentence decline gate, a deterministic leak scan, a voice
    gate with one corrective retry, a private-topic gate that refuses before any model call, and a query rewrite + attribution matrix so any on-book question is answerable without per-question tuning
  technology:
  - fastembed local embeddings
  - cosine retrieval over an untracked private corpus
  - Claude Sonnet 5 via the reasoning gateway
  - deterministic regex gates
  - durable event ledger review queue
  business_scenario: A recruiter or hiring manager asks a normal interview question and gets a short first-person answer; off-book, world-knowledge and private-secret questions refuse
  implementation_state: IMPLEMENTED
  test_state: TESTED
  production_state: PRODUCTION_ACTIVE
  evidence_links:
  - https://agentic-platform-backend-production.up.railway.app/standing-interview
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/standing_interview.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/si_acceptance.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/test_standing_interview.py
  evidence_note:
  - 'Sprint 13 (2026-09-29): 15/15 acceptance (9 exam + 6 unseen questions) on four consecutive production runs; 117 hermetic tests; independent qa-evaluator pass confirmed all 8 claims'
  - 'No book text in the public repository: the corpus is untracked and delivered at deploy time'
  relevant_modules:
  - agent/standing_interview.py
  - agent/si_acceptance.py
  - agent/si_review.py
  - scripts/build_si_corpus.py
  interview_topics:
  - grounding threshold measured against real score populations, not guessed
  - why a deterministic gate is the control and a prompt rule is advisory
  - false positives in a refusal-class scanner and pinning both senses
  - an attribution matrix as the deterministic answer to 'where did you use X'
  job_market_tags:
  - rag
  - llm
  - guardrails
  - evals
  - ai-engineering
  verification_level: PRODUCTION_VERIFIED
- id: reasoning-gateway-kill-switch
  display_name: 'Single model boundary: a central reasoning gateway with a purpose allowlist and a zero-LLM kill switch'
  engineering_problem_solved: Every Anthropic call in the platform goes through one function that names an advisory purpose from a fixed allowlist, honours a live LLM_MODE=DISABLED switch, takes an injectable
    create_fn so every path is hermetically testable, and reports a denial as its own state instead of an empty answer
  technology:
  - Python
  - Anthropic SDK
  - enforcement test that fails the build on any direct SDK import outside the gateway
  business_scenario: An organisation that must be able to prove which code paths can spend model tokens, switch them all off at once, and test the surrounding logic without a network
  implementation_state: IMPLEMENTED
  test_state: TESTED
  production_state: PRODUCTION_ACTIVE
  evidence_links:
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/reasoning_gateway.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/test_reasoning_gateway_enforcement.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/docs/ZERO_LLM_MODE_PROOF.md
  evidence_note:
  - The Standing Interview and the durable workflow's advisory step both route through it in production; the enforcement test caught the first version of standing_interview.py importing the SDK directly
  relevant_modules:
  - agent/reasoning_gateway.py
  - agent/test_reasoning_gateway.py
  - agent/test_reasoning_gateway_enforcement.py
  interview_topics:
  - 'capability is not authority: naming a purpose does not grant it'
  - kill switch checked live, not cached at import
  - why 'thinking consumed the whole max_tokens budget' must be reported, not swallowed
  job_market_tags:
  - llm
  - ai-governance
  - observability
  - ai-engineering
  verification_level: PRODUCTION_VERIFIED
- id: hitl-hash-bound-write-boundary
  display_name: Human-in-the-loop write boundary with approval bound by hash to the exact content approved
  engineering_problem_solved: The model can propose a source change but has no code path to approve it; approval is bound to sha256(path, content) and re-checked at apply time so a proposal cannot be swapped
    between approval and application; the write scope is three path prefixes and two extensions, checked twice
  technology:
  - Python
  - unified diff proposals
  - sha256 binding
  - allowlisted Maven compile/test as the only build operations
  business_scenario: Any AI-assisted delivery pipeline where a human must remain the authority over what reaches the codebase, structurally rather than by policy
  implementation_state: IMPLEMENTED
  test_state: TESTED
  production_state: PRODUCTION_ACTIVE
  evidence_links:
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/write_tools.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/execution_tools.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/test_write_tools.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/test_execution_tools.py
  evidence_note:
  - Tests prove a content substitution and a path substitution after approval are each rejected, and that approve/reject are absent from the tool schemas by exact set membership
  - Reused unchanged by the durable workflow (Sprint 13)
  relevant_modules:
  - agent/write_tools.py
  - agent/execution_tools.py
  - agent/build_tools.py
  interview_topics:
  - approval as a hash binding, not a boolean flag
  - fail-closed on a non-interactive approval prompt
  - why the build tool is an allowlist of two goals, never a shell
  job_market_tags:
  - ai-safety
  - human-in-the-loop
  - ai-engineering
  - security
  verification_level: PRODUCTION_VERIFIED
- id: durable-langgraph-workflow
  display_name: Durable, stateful software-change workflow on LangGraph with Postgres checkpoints, HITL interrupt/resume and idempotent side effects
  engineering_problem_solved: 'Run requirement -> investigate -> propose -> wait for human approval -> apply -> compile -> test -> verify -> complete as an explicit graph whose state survives a process
    death: checkpoints in the ledger''s Postgres, synchronous durability, a resumed apply stage that recognises its own commit and never writes twice, a corrupt checkpoint reported rather than resumed,
    and the model gaining no authority'
  technology:
  - LangGraph 1.2 (StateGraph, interrupt, Command(resume))
  - custom BaseCheckpointSaver on PostgreSQL
  - isolated git workspaces
  - existing risk policy / write boundary / build boundary reused
  business_scenario: Long-running agent work that must pause for a human, survive a restart or crash, and never repeat a side-effecting step
  implementation_state: IMPLEMENTED
  test_state: TESTED
  production_state: PRODUCTION_ACTIVE
  evidence_links:
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/durable_workflow.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/workflow_checkpointer.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/agent/workflow_drill.py
  - https://github.com/karthikdevadoss/agentic-software-delivery/blob/master/docs/DURABLE_EXECUTION_RECOVERY.md
  evidence_note:
  - 'Crash drill 22/22 in one run: a real child process killed after the git commit and before the checkpoint, resumed by a fresh process with exactly one commit and compile/test/verify completed; kill
    at the node boundary; reject-then-approve refused; corrupt row CORRUPT'
  - 'Production (2026-09-29): a workflow survived a real container restart while waiting for approval, then completed its whole pipeline inside the container; a kill during the pipeline is proven locally
    only'
  relevant_modules:
  - agent/durable_workflow.py
  - agent/workflow_checkpointer.py
  - agent/workflow_drill.py
  - agent/test_durable_workflow.py
  interview_topics:
  - LangGraph's default async durability and why a durable workflow asks for sync
  - idempotency keys must be derivable from durable identity, not recorded by the step that may die
  - what a checkpoint store must validate before trusting a decoded blob
  job_market_tags:
  - langgraph
  - ai-agents
  - durable-execution
  - human-in-the-loop
  - postgresql
  verification_level: PRODUCTION_VERIFIED
