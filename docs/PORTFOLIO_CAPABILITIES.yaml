# ---------------------------------------------------------------------------
# Fast future JD workflow (documented per the Owner's Priority 6 instruction)
# ---------------------------------------------------------------------------
# 1. Paste the job description's requirements list.
# 2. For each requirement, find the closest matching capability id above.
# 3. Classify: STRONGLY_DEMONSTRATED (capability exists, production_state is
#    PRODUCTION_ACTIVE or well-evidenced) / PRESENT_BUT_SHOWCASE_WEAK
#    (capability exists but evidence_links/interview_topics are thin) /
#    IMPORTANT_MISSING (no matching capability, and the role clearly needs
#    it) / NOT_WORTH_ADDING (a nice-to-have with low relevance to this role).
# 4. Create showcases/<slug>/showcase.yaml (see showcases/senior-java-ai-transformation/
#    for the reference template) selecting only the STRONGLY_DEMONSTRATED and
#    PRESENT_BUT_SHOWCASE_WEAK capabilities relevant to this role.
# 5. Only if an IMPORTANT_MISSING item is both high-value and small, implement
#    it through the normal Verification Contract -> Test Impact Analysis ->
#    selective verification -> production evidence pipeline before adding it
#    to the showcase. Never invent a capability in the showcase that isn't
#    real yet.
# 6. Share the role-specific showcase URL.
# Target: hours, not days, per application.
