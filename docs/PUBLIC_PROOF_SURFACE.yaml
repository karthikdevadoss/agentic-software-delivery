- capability_id: real-topology-gating-tier
  tier: SECONDARY
  public_status: TESTED_VERIFIED
  headline: Multi-service behaviour tested on a real topology
  public_claim: >-
    The microservice decomposition has a test tier that runs against a real
    multi-process topology, because a behaviour such as routing or load
    balancing cannot be proven by a single-process test however green it is.
  limitation_short: "Tested but not provisioned in production; informational in CI, and a skip is reported as a skip."
  public_limitation: >-
    This tier is tested but not provisioned in production, and it is informational
    in CI rather than blocking. A skipped run is reported as skipped, never as
