  # ================= DELIVERY / CI-CD =================
  - name: "Deployment-identity confirmation via real timestamps, not id-difference guessing"
    category: DELIVERY
    business_why: "A Railway 'SUCCESS' status alone doesn't prove which build is actually serving traffic -- comparing deployment ids can be wrong; comparing real creation timestamps against the moment THIS run triggered a deploy is the honest signal."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: agent/demo_execution.py
        class: "wait_for_new_deployment, trigger_deploy, server_verified_now_iso"
    related_incidents: ["A prior version compared deployment timestamps as raw strings instead of parsed datetimes -- happened to work for every prior fixture but wasn't reliably correct; fixed with real datetime parsing and a constructed counterexample regression test"]
    interview_topics: ["why id-difference is not a safe deployment-identity signal", "server-verified 'now' (an independent time source) vs trusting the local clock"]

  - name: "Independent production-content assertion after deploy (never HTTP 200 alone)"
    category: DELIVERY
    business_why: "A healthy HTTP 200 healthcheck proves the process is running, not that the REQUESTED change is actually live -- only checking the real, specific expected content does that."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: agent/web_server.py
        class: "_verify_content_with_retry, _decide_deployment_outcome"
    interview_topics: ["a genuine DEPLOYMENT_STATUS_UNKNOWN outcome vs silently folding uncertainty into FAILED", "content-verification retry window distinguishing build SUCCESS from traffic cutover"]

  - name: "Isolated-workspace git clone/commit/push, never mutating the deployed container's own checkout"
    category: DELIVERY
    business_why: "The deployed container's own long-lived git checkout is not a safe thing to commit into live -- every real run clones a fresh, disposable workspace instead."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: agent/demo_execution.py
        class: "create_isolated_workspace, commit_change, push_change, cleanup_workspace"
    interview_topics: ["why NOT to git-push from inside the running deployed process's own checkout", "dedicated demo/<run_id> branches, never master directly", "redacting a push token from all captured subprocess output before it can reach any logged event"]

  - name: "Docker multi-stage build for a Java web service"
    category: DELIVERY
    business_why: "The platform-backend's own deployment image needed a JDK matching app/pom.xml's real target (a mismatch silently broke every real compile/test from inside that container until this project's own testing caught it)."
