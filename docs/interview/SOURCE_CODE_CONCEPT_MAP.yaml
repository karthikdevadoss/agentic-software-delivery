  # ================= AI DELIVERY =================
  - name: "Environment/toolchain preflight (fail-closed, not a code-defect false-positive)"
    category: AI_DELIVERY
    business_why: "A real JDK-version mismatch must never be reported as a test/code failure -- it's a categorically different, more actionable failure class."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: agent/environment_preflight.py
        class: "check_java_toolchain, required_java_major_version"
      - path: agent/build_tools.py
        class: "run_maven (calls preflight before any subprocess)"
      - path: agent/triage_execution.py
        class: "_run_focused_maven_tests (same preflight, shared across all 3 Triage scenarios)"
    related_incidents: ["AEQ-021: platform-backend Docker image had JDK 17 while pom.xml required 21 -- silently broke every real compile/test from that container"]
    interview_topics: ["detected >= expected, never equality (a newer JDK cross-compiles fine)", "ENVIRONMENT_INVALID as its own status distinct from FAILED"]

  - name: "AI-generated candidate patch, verified in an isolated workspace"
    category: AI_DELIVERY
    business_why: "Diagnosing a defect and actually writing a correct fix are different capabilities -- both must be demonstrated, and neither should be trusted without independent verification."
    implementation_status: DEMO_AVAILABLE
    source_files:
      - path: agent/triage_execution.py
        class: "generate_candidate_patch/_b/_c, apply_and_verify_candidate/_b/_c, _isolated_compile_java_candidate (the ONE shared engine all three call)"
    request_flow: "real evidence + real defective file -> Claude call (not told the answer) -> candidate file content -> isolated temp copy of app/ -> difflib diff -> real mvnw compile -> result shown, never auto-promoted to master"
    related_tests: [test_triage_execution.py::GenerateCandidatePatchTestCase, ApplyAndVerifyCandidateTestCase, GenerateCandidatePatchBTestCase, ApplyAndVerifyCandidateBTestCase, GenerateCandidatePatchCTestCase, ApplyAndVerifyCandidateCTestCase]
    production_evidence: "Live-verified for all three scenarios: the model's independently-derived fix for Scenario B was substantively identical to the real production predicate it had never been shown"
    interview_topics: ["why ask for full file content, not a raw unified diff (line-number fragility)", "why isolate via temp copy instead of git worktree (AEQ-020 container git-history gap)", "the deliberate boundary: verify, never auto-promote", "one shared engine reused by 3 scenarios vs 3 parallel implementations"]

  - name: "Extended-thinking token-budget exhaustion -- effort control, not a bigger max_tokens"
    category: AI_DELIVERY
    business_why: "A model call that silently spends its ENTIRE token budget on internal reasoning and emits zero real output must be caught and reported honestly, not misread as an unrelated downstream failure (a blank file that then 'fails to compile')."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: agent/triage_execution.py
        class: "_call_model_text"
        methods: ["_call_model_text (empty-text detection + effort passthrough)"]
    related_incidents: ["Live production testing of Triage Scenario C's candidate-patch step found generated=True with an EMPTY candidate_source, which then wrote a blank file and reported a confusing, unrelated COMPILE_FAILED. Root-caused with a direct diagnostic script (not guessed): response.content held only a ThinkingBlock, stop_reason='max_tokens' -- claude-sonnet-5 runs adaptive extended thinking by default and can consume an entire max_tokens budget before any text. Raising max_tokens alone (2048->4096) did not fully fix it; the real fix was output_config.effort='low' for this mechanical, non-hard-reasoning task."]
    interview_topics: ["adaptive thinking vs a fixed thinking budget", "why 'increase the ceiling' is often the wrong first instinct for a token-budget bug", "detecting a silent empty-output failure mode in ONE shared helper vs patching each of 3 call sites separately"]

