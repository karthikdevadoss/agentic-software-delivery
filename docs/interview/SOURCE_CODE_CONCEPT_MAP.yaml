        class: AppointmentAvailabilityConfig
      - path: app/src/main/java/com/example/customer/integration/appointment/demo/DemoAppointmentProviderController.java
        class: DemoAppointmentProviderController
    related_tests: [AppointmentAvailabilityIntegrationTest (7 real WireMock cases)]
    interview_topics: ["circuit breaker states", "retry predicate (why 4xx never retried)", "timeout config", "why CORE module not the annotation starter (Spring Boot 4 BOM gap)"]

  - name: "Isolated pedagogical replay of a wrong retry predicate"
    category: RESILIENCE
    business_why: "Demonstrating a retry-classification bug live (retrying a non-retryable 4xx) must never risk degrading the REAL, correct production retry policy real customers depend on."
    implementation_status: DEMO_AVAILABLE
    source_files:
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioBService.java
        class: TriageScenarioBService
        methods: ["buggyRetry (private, unregistered Retry instance)", "reproduce"]
    related_tests: [TriageScenarioBIntegrationTest]
    production_evidence: "Live-verified: buggy predicate makes 3 real HTTP attempts against a genuine 400; the real production predicate makes exactly 1"
    interview_topics: ["why the buggy Retry is a private field, never added to the shared RetryRegistry", "reaching the downstream over a genuine HTTP loopback (never a direct method call) so the mechanics stay real", "fixApplied delegating to the REAL production appointmentRetry bean, never a second copy of the fix"]

  # ================= TESTING =================
  - name: "Test Impact Analysis + risk/blast-radius classification"
