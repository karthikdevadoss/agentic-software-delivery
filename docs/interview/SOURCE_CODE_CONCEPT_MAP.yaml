# Personal interview-prep infrastructure -- machine-readable, NOT public
# UI. Purpose: precise mappings from engineering concepts to the exact
# real code that demonstrates them, so a later interview PDF can be
# generated quickly without re-deriving "where is this in the codebase"
# from scratch.
#
# Every entry maps only to code that genuinely exists -- verified against
# the real repository (file existence + read content), never guessed.
# Deep explanations belong in the PDF, not here -- this file is precise
# pointers, one paragraph max per concept.
#
# EXPANDED 2026-09-15 (flagship-completion session, Priority 9): grown
# from 17 to a fuller pass across Core Java, Spring Core/Boot/MVC/
# Security, Transactions, JPA/Hibernate, PostgreSQL, JDBC/HikariCP,
# Redis, Kafka, Resilience, Testing, Observability, AI Delivery, and
# Delivery/CI-CD -- every new entry's source_files were confirmed to
# exist and were read in full before being cited here.

schema_note: >
  concept: {name, category, business_why, implementation_status,
  source_files: [{path, class, methods}], request_flow, related_tests,
  production_evidence, related_incidents, interview_topics}

concepts:

  # ================= CORE JAVA / LANGUAGE =================
  - name: "Records for immutable DTOs"
    category: CORE_JAVA
    business_why: "Request/response shapes should be immutable and free of boilerplate getters/equals/hashCode."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/dto/ContractPlanEnrollRequest.java
        class: ContractPlanEnrollRequest
      - path: app/src/main/java/com/example/customer/dto/ContractPlanResponse.java
        class: ContractPlanResponse
        methods: ["from(ContractPlan)"]
      - path: app/src/main/java/com/example/customer/triage/TriageBReproductionResult.java
        class: TriageBReproductionResult
      - path: app/src/main/java/com/example/customer/triage/TriageCReproductionResult.java
        class: TriageCReproductionResult
    interview_topics: ["records vs classes", "compact canonical constructors", "why DTOs shouldn't be JPA entities"]

  - name: "Optional for null-safety in service logic"
    category: CORE_JAVA
    business_why: "Avoid NPEs on 'no active plan' style absent-value cases without sentinel nulls."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/service/ContractPlanService.java
        class: ContractPlanService
        methods: ["enroll", "getActivePlan"]
    related_incidents: ["AEQ-018 (plan-enrollment idempotency)"]
    interview_topics: ["Optional.filter/ifPresent composition", "when NOT to use Optional (fields, params)"]

  - name: "Enums for exhaustive, type-safe state modeling"
    category: CORE_JAVA
    business_why: "A contract plan's lifecycle (ACTIVE/CANCELLED/PENDING) and a preference's channel (EMAIL/SMS/NONE) must never be a loose, typo-prone String."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/model/ContractPlanStatus.java
        class: ContractPlanStatus
      - path: app/src/main/java/com/example/customer/model/NotificationChannel.java
        class: NotificationChannel
    interview_topics: ["enum vs String constants", "@Enumerated storage in JPA", "exhaustive switch over an enum"]

  - name: "Custom unchecked exceptions mapped to specific HTTP statuses"
    category: CORE_JAVA
    business_why: "A cross-tenant access attempt (403) and a bad login (401) are different failure classes from 'not found' (404) -- each needs its own exception type, not a shared generic one."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/exception/ForbiddenWorkspaceAccessException.java
        class: ForbiddenWorkspaceAccessException
      - path: app/src/main/java/com/example/customer/exception/InvalidCredentialsException.java
        class: InvalidCredentialsException
      - path: app/src/main/java/com/example/customer/exception/GlobalExceptionHandler.java
        class: GlobalExceptionHandler
    interview_topics: ["checked vs unchecked for a domain exception", "one exception type per real failure class, not a generic RuntimeException"]

  - name: "AtomicLong + synchronized for simple isolated in-memory state"
    category: CORE_JAVA
    business_why: "Each Triage Lab scenario reset needs a genuinely unique, monotonically-increasing synthetic customer id, safe under concurrent recruiter/interviewer usage, without the overhead of a real distributed counter."
    implementation_status: DEMO_AVAILABLE
    source_files:
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioAService.java
        class: TriageScenarioAService
        methods: ["reset (RESET_COUNTER.incrementAndGet())"]
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioCService.java
        class: TriageScenarioCService
        methods: ["reset"]
    interview_topics: ["AtomicLong vs synchronized(this) for a simple counter", "when in-memory state is acceptable (demo-scoped, not real business data)"]

  # ================= SPRING CORE =================
  - name: "Constructor injection as the only dependency-injection style"
    category: SPRING_CORE
    business_why: "Fields should be final and every dependency explicit at construction time -- no hidden @Autowired field magic, no partially-constructed objects."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/controller/CustomerController.java
        class: CustomerController
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioBService.java
        class: TriageScenarioBService
    interview_topics: ["constructor vs field vs setter injection", "why final fields force this discipline", "testability benefit (easy to construct with fakes)"]

  - name: "@Lazy injection to break a bean-initialization-order bug"
    category: SPRING_CORE
    business_why: "A @SpringBootTest(webEnvironment=RANDOM_PORT) test resolves an eagerly-initialized @Value('${appointment.service.base-url}') before the real random port is published, breaking the self-loopback default."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/integration/appointment/AppointmentAvailabilityConfig.java
        class: AppointmentAvailabilityConfig
        methods: ["appointmentAvailabilityClient (@Lazy bean)"]
      - path: app/src/main/java/com/example/customer/integration/appointment/AppointmentAvailabilityService.java
        class: AppointmentAvailabilityService
        methods: ["constructor (@Lazy AppointmentAvailabilityClient injection point)"]
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioBService.java
        class: TriageScenarioBService
        methods: ["constructor (@Lazy AppointmentAvailabilityClient injection point)"]
    related_incidents: ["@Lazy on the bean ALONE was not sufficient the first time this was tried -- the INJECTION POINT also needed @Lazy so Spring injects a lazy-resolving proxy there, deferring @Value resolution past finishBeanFactoryInitialization()"]
    interview_topics: ["Spring bean lifecycle phases", "why @Lazy on a bean isn't enough without a lazy injection point too", "random-port test timing gotchas"]

  - name: "@Configuration + @Bean programmatic composition (Resilience4j CORE, not the annotation starter)"
    category: SPRING_CORE
    business_why: "resilience4j-spring-boot3/4's annotation starter has a real, documented Spring Boot 4 BOM compatibility gap -- the CORE circuitbreaker/retry modules, wired programmatically, produce identical runtime behavior without that dependency risk."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/integration/appointment/AppointmentAvailabilityConfig.java
        class: AppointmentAvailabilityConfig
        methods: ["circuitBreakerRegistry", "retryRegistry", "appointmentCircuitBreaker", "appointmentRetry"]
    interview_topics: ["@Bean method composition vs component scanning", "why a registry (not a bare CircuitBreaker.of) -- Micrometer metrics binding"]

  - name: "@Profile-gated bean wiring (postgres vs default H2)"
    category: SPRING_CORE
    business_why: "Local development and CI need a fast, zero-infrastructure H2 default; production needs real Postgres with Flyway-managed schema -- both from the same codebase, selected by one property."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/resources/application.properties
      - path: app/src/main/resources/application-postgres.properties
    related_tests: [PostgresFlywayIntegrationTest, TriageScenarioCPostgresIntegrationTest]
    interview_topics: ["Spring profiles vs separate config files", "ddl-auto=validate on postgres vs default create-drop on H2", "why the H2 default was never removed even after the Postgres cutover"]

  # ================= SPRING BOOT =================
  - name: "Actuator health/info/metrics/Prometheus endpoints"
    category: SPRING_BOOT
    business_why: "A real production deployment needs a liveness/readiness probe Railway can poll, plus real scrapeable metrics -- not just 'the app didn't crash.'"
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/resources/application.properties
        class: "management.endpoints.web.exposure.include=health,info,metrics,prometheus"
    related_incidents: ["management.health.redis.enabled=false / management.health.kafka.enabled=false -- both integrations exist in code but aren't production-provisioned, so their default Actuator health indicators would otherwise falsely report the whole app DOWN"]
    interview_topics: ["liveness vs readiness probes", "why an optional/not-provisioned dependency's health check must be explicitly disabled, not left to fail"]

  - name: "Starter dependencies + auto-configuration"
    category: SPRING_BOOT
    business_why: "spring-boot-starter-validation was once a declared-but-unused dependency -- a real, inspected gap, not a hypothetical one -- fixed by actually wiring Bean Validation into the entities/controllers that needed it."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/pom.xml
    interview_topics: ["what a starter actually bundles", "auto-configuration conditional beans (@ConditionalOnClass etc.)", "the real Spring Boot 4 spring-boot-flyway split (a starter that quietly stopped being a transitive dependency of flyway-core)"]

  # ================= SPRING MVC =================
  - name: "Centralized @RestControllerAdvice exception mapping"
    category: SPRING_MVC
    business_why: "Every error response should be structured JSON with a consistent shape, not a mix of inline per-controller handlers and raw plain-text bodies."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/exception/GlobalExceptionHandler.java
        class: GlobalExceptionHandler
        methods: ["handleNotFound", "handleValidationFailure", "handleBadRequest", "handleForbiddenWorkspace", "handleInvalidCredentials"]
    interview_topics: ["@ExceptionHandler resolution order (most specific exception type wins)", "why this replaced an inline single-exception handler on CustomerController", "structured field-level validation errors vs a flat message"]

  - name: "Bean Validation at the controller boundary (@Valid/@NotBlank/@Email)"
    category: SPRING_MVC
    business_why: "A malformed customer name or email should never reach the service/persistence layer -- reject it at the edge with a clear, field-level 400."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/model/Customer.java
        class: Customer
        methods: ["name (@NotBlank)", "email (@NotBlank @Email)"]
      - path: app/src/main/java/com/example/customer/controller/CustomerController.java
        class: CustomerController
        methods: ["createCustomer (@Valid @RequestBody)", "updateEmail (@Valid @RequestBody)"]
    interview_topics: ["annotation-driven validation vs manual checks", "MethodArgumentNotValidException -> structured 400"]

  - name: "@AuthenticationPrincipal Jwt + per-request workspace scoping"
    category: SPRING_MVC
    business_why: "A controller method needs the real, verified JWT claims (not a client-supplied header) to decide whether THIS caller may access THIS customer id."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/controller/CustomerController.java
        class: CustomerController
        methods: ["getCustomer", "updateEmail"]
      - path: app/src/main/java/com/example/customer/security/WorkspaceAccessGuard.java
        class: WorkspaceAccessGuard
        methods: ["assertAccessible"]
    interview_topics: ["@AuthenticationPrincipal binding to the resolved Jwt", "server-side authorization vs trusting a client-supplied id"]

  # ================= SPRING SECURITY =================
  - name: "OAuth2 resource-server JWT validation (signature/expiry/issuer/audience)"
    category: SPRING_SECURITY
    business_why: "Multi-persona (USER/ADMIN) access must be cryptographically verified server-side, never client-trusted."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/security/SecurityConfig.java
        class: SecurityConfig
        methods: ["securityFilterChain", "jwtDecoder"]
      - path: app/src/main/java/com/example/customer/security/DemoJwtIssuer.java
        class: DemoJwtIssuer
      - path: app/src/main/java/com/example/customer/security/WorkspaceAccessGuard.java
        class: WorkspaceAccessGuard
        methods: ["assertAccessible"]
    request_flow: "Bearer JWT -> NimbusJwtDecoder (sig+exp+iss+aud) -> SCOPE_* authority -> WorkspaceAccessGuard (cid claim vs path customerId) -> controller"
    related_tests: [SecurityIntegrationTest, WorkspaceIsolationIntegrationTest]
    production_evidence: "Real /auth/login + real 401/403 verified live (docs/interview-scenarios/01)"
    interview_topics: ["JWT vs session auth", "scope-based authorization", "cross-tenant isolation enforcement"]

  - name: "BCrypt password hashing"
    category: SPRING_SECURITY
    business_why: "Demo credentials still must never be stored/compared in plaintext."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/security/DemoIdentitySeeder.java
        class: DemoIdentitySeeder
      - path: app/src/main/java/com/example/customer/security/DemoLoginController.java
        class: DemoLoginController

  - name: "Per-scenario ADMIN-only authorization rules (RBAC)"
    category: SPRING_SECURITY
    business_why: "Every Triage Lab scenario's one irreversible action (approving a fix) must require the real 'admin:read' scope -- reset/reproduce/state stay anonymous-reachable by design (isolated synthetic data only), the exact same shape repeated three times, not three different security postures."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/security/SecurityConfig.java
        class: SecurityConfig
        methods: ["securityFilterChain (scenario-a/b/c matchers)"]
    related_tests: [TriageScenarioAIntegrationTest, TriageScenarioBIntegrationTest, TriageScenarioCIntegrationTest]
    interview_topics: ["hasAuthority vs hasRole", "why reset/reproduce are deliberately permitAll (isolation, not laziness)", "anonymous 401 vs authenticated-but-forbidden 403"]

  # ================= TRANSACTIONS =================
  - name: "@Transactional write boundary + readOnly hint"
    category: TRANSACTIONS
    business_why: "A write (enroll) needs a real transaction boundary; a pure read (a diagnostic search query) should be marked readOnly so a query-execution failure can never accidentally escalate an unrelated write's transaction."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/service/ContractPlanService.java
        class: ContractPlanService
        methods: ["enroll (@Transactional)"]
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioCService.java
        class: TriageScenarioCService
        methods: ["reproduce (@Transactional(readOnly = true))"]
    interview_topics: ["propagation defaults (REQUIRED)", "why readOnly matters even for a query that might throw", "transaction boundary = the whole method, not just the DB call"]

  - name: "Idempotency via a no-op check before mutating state"
    category: TRANSACTIONS
    business_why: "A duplicate submission (double-click, or a client retry after a timeout whose original call actually succeeded) must not be treated as a second business event."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/service/ContractPlanService.java
        class: ContractPlanService
        methods: ["enroll", "isSameTerms"]
    related_tests: [ContractPlanServiceTest::enroll_whenIdenticalRequestSubmittedTwice_isIdempotentNoOp]
    related_incidents: ["AEQ-018: found by code inspection, not a bug report -- enroll() had NO duplicate-request protection at all before this fix"]
    docs: docs/interview-scenarios/04-plan-enrollment-idempotency.md
    interview_topics: ["idempotency key patterns vs domain-level equality check", "why 'the second call is a no-op' beats 'the second call errors'"]

  # ================= JPA / HIBERNATE =================
  - name: "Flush-order transaction bug (INSERT-before-UPDATE)"
    category: JPA_HIBERNATE
    business_why: "A superseding plan enrollment must never leave two ACTIVE rows, even for one instant."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/service/ContractPlanService.java
        class: ContractPlanService
        methods: ["enroll"]
    related_tests: [ContractPlanServiceTest::enroll_whenActivePlanAlreadyExists_flushesTheCancellationBeforeInsertingTheNewPlan, PostgresFlywayIntegrationTest]
    related_incidents: ["Hibernate default flush order bug -- invisible on H2, real on Postgres"]
    interview_topics: ["Hibernate flush order", "saveAndFlush vs save", "why H2 hid this bug"]

  - name: "Direct EntityManager JPQL vs Spring Data derived/@Query repositories"
    category: JPA_HIBERNATE
    business_why: "Most of this codebase uses Spring Data JpaRepository + @Query for real business queries; the Triage Lab's isolated pedagogical replay deliberately uses EntityManager directly instead, so its query never lives in (or could ever be confused with) a real production repository interface."
    implementation_status: DEMO_AVAILABLE
    source_files:
      - path: app/src/main/java/com/example/customer/triage/TriageScenarioCService.java
        class: TriageScenarioCService
        methods: ["searchBuggy", "searchFixed"]
      - path: app/src/main/java/com/example/customer/repository/CustomerRepository.java
        class: CustomerRepository
        methods: ["searchWorkspaceCustomers (the real, current, correct production query)"]
    interview_topics: ["when to drop to EntityManager.createQuery vs a repository method", "isolating a deliberately-defective query so it can never be reached by real traffic"]

  # ================= POSTGRESQL =================
  - name: "Flyway versioned schema migrations"
    category: POSTGRES
    business_why: "Schema changes must be ordered, repeatable, and applied identically in every environment (local postgres profile, CI Testcontainers, real production) -- never a hand-run ALTER TABLE."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/resources/db/migration/V1__create_customer.sql
      - path: app/src/main/resources/db/migration/V2__create_customer_preference.sql
      - path: app/src/main/resources/db/migration/V3__create_contract_plan.sql
      - path: app/src/main/resources/db/migration/V4__create_outbox_event.sql
      - path: app/src/main/resources/db/migration/V5__create_processed_event.sql
      - path: app/src/main/resources/db/migration/V6__create_demo_identity.sql
    related_tests: [PostgresFlywayIntegrationTest::flywayMigrationsCreateTheExpectedRealPostgresTables]
    related_incidents: ["Spring Boot 4 split spring-boot-flyway into its own autoconfiguration module -- flyway-core alone (the library) was on the classpath without it, root-caused only by decompiling FlywayAutoConfiguration's bytecode after two wrong-hypothesis fix attempts"]
    interview_topics: ["versioned vs repeatable migrations", "ddl-auto=validate as a safety net against schema drift", "V1-V6 evolution as a readable history of the domain model"]

  - name: "Partial unique index as last line of defense"
    category: POSTGRES
    business_why: "Application-level idempotency logic can have gaps; the database constraint is the real guarantee."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/resources/db/migration/V3__create_contract_plan.sql
        class: "uq_contract_plan_one_active_per_customer (partial unique index)"
    related_tests: [PostgresFlywayIntegrationTest::oneActivePlanPerCustomer_isEnforcedByTheRealDatabaseConstraint_notOnlyServiceLogic]
    interview_topics: ["partial index WHERE clause", "constraint vs application logic layering", "a direct duplicate INSERT bypassing the service layer entirely, still rejected"]

  - name: "JPQL LOWER/CONCAT bind-parameter type-inference bug"
    category: POSTGRES
    business_why: "Case-insensitive admin search must work identically on the real production database, not just H2."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/repository/CustomerRepository.java
        class: CustomerRepository
      - path: app/src/main/java/com/example/customer/controller/AdminCustomerController.java
        class: AdminCustomerController
        methods: ["likePattern"]
    related_incidents: ["AEQ-012, real production 500: function lower(bytea) does not exist"]
    production_evidence: "docs/interview-scenarios/02-postgres-search-pagination.md"
    interview_topics: ["pgjdbc type inference", "why a green H2 suite isn't proof", "LIKE pattern building in Java vs JPQL", "2026-09-15 follow-up finding: this exact defect no longer reproduces on the current pgjdbc/Hibernate stack -- a real example of a dependency upgrade silently resolving an old bug (see Triage Scenario C)"]

  - name: "Server-side pagination + workspace-scoped search"
    category: POSTGRES
    business_why: "Never download the full customer table to filter client-side."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/java/com/example/customer/repository/CustomerRepository.java
      - path: app/src/main/java/com/example/customer/controller/AdminCustomerController.java
    related_tests: [AdminCustomerControllerIntegrationTest]
    interview_topics: ["Pageable/Page", "correlated subquery vs JOIN for scoping"]

  # ================= JDBC / HIKARI =================
  - name: "HikariCP connection pooling (Spring Boot default)"
    category: JDBC_HIKARI
    business_why: "Every request that touches the database borrows a pooled physical connection rather than opening a new TCP/TLS connection per request -- and the pool's own lifecycle is what surfaced a real production incident when one connection was held open too long."
    implementation_status: PRODUCTION_ACTIVE
    source_files:
      - path: app/src/main/resources/application.properties
      - path: app/src/main/resources/application-postgres.properties
    related_incidents: ["P0: an idle-in-transaction connection held for 963s blocked ensure_schema()'s DDL and froze every subsequent request routed through it -- root-caused via a direct pg_stat_activity query, fixed with statement_timeout and idle_in_transaction_session_timeout"]
    interview_topics: ["connection pool sizing", "idle-in-transaction as a real production hazard class", "why a stuck DB call on the event loop can freeze unrelated requests"]

  # ================= REDIS =================
  - name: "Cache-aside with fail-open fallback"
    category: REDIS
    business_why: "Active-plan reads happen on every page load; an optional cache must never become a hard dependency."
    implementation_status: "INTEGRATION_TESTED (Testcontainers) -- NOT PRODUCTION PROVISIONED"
    source_files:
      - path: app/src/main/java/com/example/customer/cache/ContractPlanCacheService.java
        class: ContractPlanCacheService
        methods: ["getActivePlan", "evict", "tryGet", "tryPut"]
      - path: app/src/main/java/com/example/customer/cache/RedisCacheConfig.java
    related_tests: [ContractPlanCacheIntegrationTest]
    production_evidence: "Real production behavior: cache_requests_total meter shows hit=0/miss=1/redis-unavailable=1 -- honest reflection of Redis genuinely not being provisioned"
    interview_topics: ["cache-aside vs write-through", "TTL choice (60s)", "why programmatic over @Cacheable here", "designing for the cache being down"]

  # ================= KAFKA / EVENT-DRIVEN =================
  - name: "Transactional outbox pattern"
    category: KAFKA
    business_why: "A preference update and its downstream event must commit atomically -- no dual-write race."
    implementation_status: "INTEGRATION_TESTED (real CI Testcontainers) -- NOT PRODUCTION PROVISIONED (app.kafka.enabled=false)"
    source_files:
      - path: app/src/main/java/com/example/customer/outbox/OutboxPublisher.java
        class: OutboxPublisher
        methods: ["publishPendingEvents", "publishOne"]
      - path: app/src/main/java/com/example/customer/outbox/OutboxEvent.java
      - path: app/src/main/java/com/example/customer/messaging/CustomerPreferenceEventConsumer.java
        class: CustomerPreferenceEventConsumer
        methods: ["onMessage"]
      - path: app/src/main/java/com/example/customer/outbox/ProcessedEvent.java
    request_flow: "CustomerPreferenceService write (1 tx: preference row + outbox row) -> OutboxPublisher poll (2s) -> Kafka -> CustomerPreferenceEventConsumer (idempotent via processed_event) -> DLT on repeated failure"
    related_tests: [CustomerPreferenceEventFlowIntegrationTest]
    related_incidents: ["Spring Boot 4 split spring-boot-kafka from spring-kafka", "log-flood incident: always-on @KafkaListener with no broker -- fixed via app.kafka.enabled gate"]
    interview_topics: ["dual-write problem", "at-least-once vs exactly-once", "idempotent consumer design", "why gate the WHOLE subsystem, not just retry politely"]
    docs: docs/interview-scenarios/05-kafka-transactional-outbox.md

  # ================= RESILIENCE / HTTP INTEGRATION =================
  - name: "Resilience4j circuit breaker + retry (programmatic composition)"
