# AI Engineering Quality Ledger
#
# Purpose: a durable, machine-readable record of real defects discovered
# while building this platform with AI-assisted (Claude Code) delivery —
# the raw material for docs/interview-scenarios/*, the Dashboard's "AI
# Engineering Learning" view, and the Owner's own interview preparation.
#
# Source discipline: every entry below is reconstructed from
# docs/LESSONS.md and docs/PROJECT_STATE.json's verification_state /
# completed_capabilities — both already-committed, evidence-backed
# records, not invented from memory. Where the exact original user/Owner
# prompt was retained verbatim in those docs, it is quoted with
# confidence: EXACT. Where only the resulting defect/fix is recorded and
# the literal prompt text was not preserved, original_prompt is
# NOT_RETAINED and confidence is INFERRED — the root-cause/fix narrative
# itself is still real and evidenced (grep the cited file/line), only the
# verbatim prompt wording is reconstructed from context, not quoted.
#
# recurrence_status values: NOT_RECURRED (fixed, no repeat observed),
# RECURRED (same class of bug happened again elsewhere — see notes),
# MONITORING (fix is new, not enough elapsed time/runs to know yet).

