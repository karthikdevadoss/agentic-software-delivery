    product_fix: "agent/si_quality.py -- a four-category oracle (ABSENCE / SCOPE_LIMIT / RECALL_LIMIT / OWNERSHIP_DISCLAIMER) that classifies a RELATION (did the question invite this?) rather than a vocabulary, so its categories stay stable where its patterns are incomplete. All four prompt sites rewritten: the budget is now explicitly ZERO with three named exceptions, the ownership rule bans overclaiming without instructing disclaiming, and attribution_line states an absence as a constraint ('never claim work there... do NOT say so in the answer unless the question asks about that employer by name'). The runtime voice gate now imports the SAME oracle the test suite uses, so the rule has exactly one definition and cannot drift. Violations are split hard/soft: a volunteered limitation triggers a retry but is SHIPPED rather than refused if the retry still carries one, because replacing a good grounded answer with a refusal is a worse outcome and over-refusal was its own registered defect."
