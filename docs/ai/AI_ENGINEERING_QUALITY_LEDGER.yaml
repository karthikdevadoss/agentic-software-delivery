    tools_context_used: "e2e/responsive-invariants.spec.js run against a real local server; then a direct Playwright probe walking the computed-style ancestor chain of one accused element, which is what produced the answer."
    model_interpreted_as: "\"An unlabelled control is one whose visible text is empty\" -- and reached for innerText because innerText is what a reader SEES. Plausible, adjacent to correct, and wrong."
    expected_behavior: "Flag only controls a screen reader would announce with no name. An anchor reading \"Quality Ledger entry AEQ-012\" has a name whether or not it is currently rendered."
    actual_behavior: "Seven Showcase links reported as unlabelled on the guard's first run: \"Quality Ledger entry AEQ-012\", \"Fix commit 9f35f27\", \"Full write-up\" and four more. All seven have good link text. They sit inside a collapsed <details>, for which Chromium reports a non-zero bounding rect while refusing to render the contents -- so innerText returns \"\" and textContent returns the real text."
    stage_introduced: "test authoring -- the guard was wrong on its first execution, before any product code was touched"
    stage_detected: "first real run of the new guard, 80 of 81 cases passing"
    detection_method: "Read the failure instead of acting on it. The seven names in the message were all obviously meaningful strings, which is what made the result implausible enough to probe rather than fix."
    root_cause: "An accessible name is computed from text CONTENT plus ARIA attributes; innerText is a rendering-dependent approximation of it that happens to agree on most elements. The guard encoded the approximation. Underneath: a new guard's FIRST result is the least trustworthy output it will ever produce, and the pressure at that moment is to make the page match the guard, because the guard is fresh and the page is old."
