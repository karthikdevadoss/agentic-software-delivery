  - defect_id: AEQ-033
    title: "The fix for AEQ-032 over-applied itself: told not to volunteer a limitation, the model also stopped stating one when the question directly asked for it -- and every test that does not call a model said the change was fine"
    requirement_run_id: "Sprint 15, immediately after the AEQ-032 specification fix; caught by agent/si_acceptance.py during the deploy script's pre-upload gate"
    original_prompt: "EXACT: \"3 - Fix the SI interview answer quality also in this sprint.\" The fix being verified here is the one AEQ-032 describes."
    analysis_confidence: EXACT
    model_provider_version: "claude-opus-5[1m] (analysis and fix); answers generated by claude-sonnet-5 against the real private corpus"
    tools_context_used: "agent/si_acceptance.py -- 15 questions (9 exam + 6 unseen) replayed against the REAL corpus with REAL model calls, run by scripts/deploy_platform_with_si_corpus.sh before `railway up`. Also a direct probe of attribution_for()/attribution_line() against the real loaded corpus to confirm which branch fires for which question phrasing."
    model_interpreted_as: "\"Do NOT volunteer a limitation. Not what you did not set up, not what you do not remember, not what someone else ran, not what a different employer did not use.\" The model applied the last clause to questions that NAMED the employer and asked about the technology directly -- which is the one case where the absence is not a volunteered limitation but the whole answer."
    expected_behavior: "Asked \"Did NRG use Kafka?\" or \"Tell me about Kafka at NRG\", say plainly that Kafka was not used there and then say what was used instead. Asked the generic \"explain your experience with Kafka\", do not tour the employers that did not use it."
    actual_behavior: "4 of 15 acceptance questions failed. \"Did NRG use Kafka?\" and \"Tell me about Kafka at NRG\" both described SQS at length and never said Kafka was not used there -- an answer that reads as dodging the question. Separately, \"How does the human approval step work on your platform?\" was refused outright (voice_rejected) on a retry whose only remaining problem was that it opened on a caveat, and \"How does your RAG retrieval work?\" was leak_blocked for saying \"the source material\" -- in an answer about what the retrieval retrieves FROM."
    stage_introduced: "specification -- the same commit that fixed AEQ-032"
    stage_detected: pre_deploy_acceptance_gate
    detection_method: "The real-model acceptance replay inside the deploy script. `set -euo pipefail` aborted before `railway up`, so nothing reached production: the deploy marker on the live service never changed and production continued serving the previous release throughout."
    root_cause: "A prompt rule is a generalisation, and a model applies it to cases the author did not enumerate. The fix stated the prohibition in the first paragraph and its three exceptions in a numbered list further down; the model weighted the prohibition. Underneath that is the harder fact: NO TEST THAT DOES NOT CALL A MODEL CAN VERIFY A PROMPT CHANGE. The unit suite asserted that SYSTEM_PROMPT CONTAINS the new rule -- which it did -- and 1,029 assertions were green (757 hermetic Python, 226 Playwright, 67 UI guards, 136 SI-specific) at the moment the model was getting this wrong on 4 of 15 real questions."
    gaps:
      prompt_gap: true
      context_rag_gap: false
      test_gap: false
      test_oracle_gap: false
      harness_gap: false
      environment_gap: false
      tool_deployment_gap: false
    product_fix: "Three changes. (1) SYSTEM_PROMPT now leads with the direct-answer case, with worked examples, BEFORE the rule it is an exception to -- 'saying you did not use it IS THE ANSWER ... the rule below does not apply to it' -- rather than leaving it to be inferred from exception 1 of 3 several paragraphs later. (2) The prompt alone still was not enough for 'Tell me about Kafka at NRG', so attribution_line() now REQUIRES the statement rather than permitting it, in exactly the case where the question names an employer the attribution matrix records as not-used: 'Your FIRST sentence must say plainly that you did not use it there.' Verified against the real corpus that this branch fires for 'Tell me about Kafka at NRG' and 'Did NRG use Kafka?' and does NOT fire for the generic 'explain your experience with Kafka' -- which is the Owner's original complaint and had to stay fixed. (3) 'opens on a limitation' reclassified as a SOFT violation (retry, then ship) and the `the source material` leak pattern given the same question-aware exemption its sibling pattern already had, scoped to the rag question family only."
    new_product_regression_test: "No new unit test, and that is the finding rather than an omission: a unit test asserting the prompt's wording would have passed before this defect and after it. The real regression guard is agent/si_acceptance.py, which already existed, already covered these exact questions, and already ran as a blocking pre-deploy step -- it worked. What changed is that its result is now recorded here as the evidence for a prompt change, rather than treated as a formality on the way to a deploy."
    new_harness_process_regression: "Generalized rule: A PROMPT CHANGE IS NOT VERIFIED BY ANY TEST THAT DOES NOT RUN THE MODEL. A green unit suite after a prompt edit proves the prompt file changed, not that behaviour did -- the two are different claims and only a replay against the real model and real retrieval can settle the second. Corollary: when a prompt states a prohibition and its exceptions, put the exception FIRST if the exception is the more important case, because a model weights a flat prohibition over a numbered carve-out. Second corollary: a deterministic instruction beats a prompt instruction where one is available -- the prompt change alone did not fix 'Tell me about Kafka at NRG'; moving the requirement into attribution_line(), where it is computed from the attribution matrix rather than inferred from prose, did."
    future_prompt_clause_learned: "When told to stop a behaviour, check what ELSE the instruction will stop. The instruction 'do not volunteer a limitation' and the instruction 'do not answer a direct question about whether you used something' are one clause apart in the model's reading, and only one of them was wanted. Write the wanted exception before the prohibition, and then go and measure it on the real thing."
    deterministic_rule_or_tooling: "attribution_line()'s required-vs-permitted branch is computed from the attribution matrix and the question text (_question_names_any), not from prompt prose -- so the case where the absence IS the answer is decided in code before the model sees anything, and a future prompt rewrite cannot quietly undo it."
