    production_evidence: "ACCEPTANCE PASSED -- 15 of 15 (9 exam + 6 unseen), after runs failing 4 of 15 and then 1 of 15. The failing runs never deployed: the gate aborted the deploy script before upload and the live deploy marker was unchanged, verified directly against the production status endpoint while the failures stood."
    recurrence_status: MONITORING

  - defect_id: AEQ-034
    title: "A guard written from the IDEA of an accessible name, not its definition -- it read innerText, which is layout-dependent, and accused seven correctly-written links of being unlabelled"
    requirement_run_id: "Sprint 17 (2026-09-30), BL-190/BL-C6, autonomous run against a written brief with the Owner away"
    original_prompt: "EXACT, from the Sprint 17 brief's BL-R1: \"Check: horizontal overflow, clipped primary controls, empty accessible names, console/page errors.\""
