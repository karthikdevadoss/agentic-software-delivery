      prompt_gap: false
      context_rag_gap: false
      test_gap: false
      test_oracle_gap: true
      harness_gap: false
      environment_gap: false
      tool_deployment_gap: false
    product_fix: "No product change was needed and none was made -- that is the outcome worth recording. The GUARD was fixed: it reads textContent, and skips any control inside a `details:not([open])`, because a control behind a closed disclosure is legitimately not exposed until the reader opens it."
    new_product_regression_test: "The corrected assertion itself, now passing on all nine public pages at 390px. The reasoning is written into the spec at the point of the skip, with the seven real link texts named, so a future reader who wonders why closed disclosures are excluded finds the incident rather than re-deriving it."
    new_harness_process_regression: "Generalized rule: WHEN A NEW GUARD ACCUSES EXISTING CODE, SUSPECT THE GUARD FIRST. This repository already required that a new test be observed FAILING against known-bad code before its pass is trusted; this is the mirror image and it was missing -- a new test must also be observed PASSING on known-GOOD code before its failure is trusted. A guard that has only ever been red has not been calibrated, it has only been written."
    future_prompt_clause_learned: "When a brief names a property by its standard term -- \"accessible name\", \"contrast ratio\", \"cumulative layout shift\" -- implement the DEFINITION, not the intuition the term evokes. The intuition is what produces a measurement that is right most of the time, and a guard that is right most of the time generates false accusations against real work."
    deterministic_rule_or_tooling: "The skip is expressed as `el.closest(\"details:not([open])\")` -- a structural fact about the document, not a heuristic about visibility, so it cannot drift as styling changes."
