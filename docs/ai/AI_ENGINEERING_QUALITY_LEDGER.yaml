  - defect_id: AEQ-036
    title: "Three plausible fixes before the binding constraint: each addressed a real inefficiency, which is exactly why each was believed"
    requirement_run_id: "Sprint 17 (2026-09-30), BL-192/BL-E"
    original_prompt: "EXACT, from the Sprint 17 brief: \"Implement a small, high-value Playwright screenshot regression mechanism.\""
    analysis_confidence: EXACT
    model_provider_version: "claude-opus-5[1m]"
    tools_context_used: "Playwright's own error output, which printed the decisive figure on the first run and was read past twice."
    model_interpreted_as: "\"The screenshot is timing out, so something in the path is too slow\" -- correct, and it produced three different candidate slow things, two of which were genuinely slow and neither of which was the cause."
    expected_behavior: "Diagnose the binding constraint before changing anything adjacent to it."
    actual_behavior: "Fix 1: raised the test timeout to 120s. No change, because toHaveScreenshot has its own fixed 5s budget -- a number printed in the first error message. Fix 2: bounded the mask list to elements actually inside the capture frame, which removed ~500 needlessly resolved locators and was a real improvement. Still failed. Fix 3, the actual cause: fullPage:true combined with a clip makes Chromium lay out and rasterise all 70,000px and THEN discard the part outside the clip. A tall viewport rasterises 1920x4000 and nothing else."
    stage_introduced: "implementation -- the original spec used fullPage plus clip, which reads as an obvious way to capture a bounded region and is not one"
    stage_detected: "the third diagnostic iteration on the same failing test"
    detection_method: "Re-reading the original error message after two fixes had not worked, and noticing that the 5000ms figure in it had never changed across any of them -- which meant nothing I had done had touched the thing that was timing out."
    root_cause: "Fixing the most plausible slow thing rather than the measured constraint. Both wrong fixes were defensible optimisations, and that is the trap: a fix that improves something real feels like progress and produces no evidence that it was not the fix. Characteristically agentic, because the cost of trying a plausible change is low enough to try three."
    gaps:
      prompt_gap: false
      context_rag_gap: false
      test_gap: false
      test_oracle_gap: false
      harness_gap: true
      environment_gap: false
      tool_deployment_gap: false
    product_fix: "Capped pages set a tall VIEWPORT and use fullPage:false, so the rasterised area is the captured area. Per-page caps rather than one number: /usage compares its first 1600px, /dashboard 4000px."
    new_product_regression_test: "Stability is the guard here and it was measured rather than assumed: three consecutive full runs, 16 of 16 passing each time. A single green run would not have distinguished a fix from a lucky sample -- which is the same reasoning the sprint applied to the SI monitor's 3 draws."
    new_harness_process_regression: "Generalized rule: when a fix does not work, check whether the error message CHANGED before trying the next one. An unchanged number in an unchanged message means the attempted fix did not touch the failing path, and that is information worth more than the next hypothesis. A second finding recorded alongside: with a 4000px cap, /usage differed from its OWN baseline by 256,034 pixels on a repeat run against the same tree -- correctly, because live ledger figures and session rows inside those 4000px change between runs. The answer was neither a looser threshold (which blinds the suite everywhere) nor a bigger mask (which hollows out the coverage it exists for), but a smaller, per-page capture region."
    future_prompt_clause_learned: "A cheap experiment is not a free experiment. Three plausible fixes cost more than one measurement, and the measurement was already in the output of the first failing run."
    deterministic_rule_or_tooling: "HISTORY_CAP_PX is a per-page dict rather than a constant, so a page whose length depends on environment data has its own number and the reason is written next to it."
    commit: "1daaf3f"
    production_evidence: "NOT APPLICABLE -- nothing deployed this sprint by instruction. Verified locally: 16 baselines, three consecutive clean runs, and a RED->GREEN proof via a planted accent-colour change observed at 15,121 and 12,381 differing pixels before revert."
