    model_provider_version: "claude-opus-5[1m]"
    tools_context_used: "python agent/ci_python_tests.py against the real tree at sprint start, before any change; then git log on the two failing modules to date the failures."
    model_interpreted_as: "Not a misinterpretation by any single session. This is a defect in the ACCUMULATED behaviour of several sessions, each of which read the log, recognised the expected failure, and proceeded correctly."
    expected_behavior: "A non-zero exit from the blocking suite means the branch cannot ship. A stochastic answer-quality miss is a real finding and is not that."
    actual_behavior: "784 tests, 2 failures. One was a Playwright spec unreachable from the TIA map -- a real deterministic wiring defect. The other was a language model declining one interview question on 2 of 3 captured draws. Both produced exit 1. The exit code therefore said RED whether or not anything had regressed, and telling the two apart required reading the log AND already knowing which failure was expected."
    stage_introduced: "Sprint 15, when the answer-quality suite was placed in the blocking bucket -- deliberately and for a good reason at the time: a skip reads as green and SKIPPED is not PASSED."
    stage_detected: "Sprint 17's own Phase 0 baseline, by running the suite before trusting the previous session's report of it."
    detection_method: "The brief required verifying the handoff's claims rather than assuming them. The handoff said three deliberate failures; the real count was two, and looking at why produced this entry."
    root_cause: "Two suites answering different questions shared one exit code. 'Is the oracle correct?' scores a frozen archive with frozen code and a failure means the measuring instrument broke. 'Is the model's output good?' scores what a language model said and a failure means it answered worse than the bar on the captured draws. Only the first is a release blocker. The agentic character of the failure is the decay path: no session ever decided to ignore the red build, each simply recognised the expected failure and moved on, and the signal degraded with no decision taken."
    gaps:
      prompt_gap: false
      context_rag_gap: false
      test_gap: false
      test_oracle_gap: false
      harness_gap: true
      environment_gap: false
      tool_deployment_gap: false
    product_fix: "agent/ci_python_tests.py gains QUALITY_MONITOR_MODULES: a bucket whose modules RUN on every invocation and whose failures are printed in full with each failing case named, but which does not set the exit code. The stochastic half of test_si_quality moved to agent/test_si_answer_quality_monitor.py. Nothing was skipped, deleted or loosened, no assertion was weakened, and no Standing Interview product behaviour was touched. agent/release_health.py is the single local entry point and prints eight things that are NOT release health with the real reason for each."
    new_product_regression_test: "agent/test_select_tests.py asserts the quality-monitor suite is never marked release_blocking, and that a paid cost class always carries the paid tag -- so a suite cannot be paid in behaviour and free-looking in the matrix. docs/testing-matrix.json is GENERATED from select_tests.SUITES, so the recorded classification cannot drift from the selector that actually runs."
    new_harness_process_regression: "Generalized rule, written where the bucket is defined so it cannot be stretched later: a module belongs in the monitor bucket ONLY if its assertion is about the CONTENT OF MODEL OUTPUT. If the same code run twice on the same input can legitimately give different verdicts, it is a monitor; if it cannot, it is release health and no amount of inconvenience moves it. 'It fails a lot' is explicitly not a qualifying reason."
    future_prompt_clause_learned: "A permanently-red gate is worse than no gate, because it looks like a gate. When a suite has been failing for more than one sprint, the question is not 'is the failure real' but 'what is this exit code still able to tell anyone' -- and that question has to be asked on a schedule, because no single session will ever be the one that decides to stop caring."
    deterministic_rule_or_tooling: "The split is structural: separate module, separate bucket, separate unittest result object, separate printed summary. A monitor failure cannot reach the exit code by accident because it is never in the same suite object."
    commit: "a81eaf8"
    production_evidence: "NOT APPLICABLE -- nothing deployed this sprint by instruction. Verified locally: 812 blocking tests with 0 failures and 3 monitor tests with 1 known RED named in the summary, so the exit code and the finding are now both readable."
