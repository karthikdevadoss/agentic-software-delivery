# Interview Walkthrough Index
#
# Deterministic, project-derived index over REAL evidence this project
# already has -- NOT a new content system. Every "story" here indexes an
# already-existing, already-real docs/interview-scenarios/<n>.md write-up
# (10 files, written 2026-09-15/16, previously unlinked from any public
# page -- this file's whole job is to surface them, not duplicate or
# replace them). Every doc/commit/defect_id/URL referenced below must be
# real and independently checkable; nothing here is invented, estimated,
# or written as first-person employment experience.
#
# Rendered by agent/interview_walkthrough_data.py -> GET
# /api/interview-walkthrough -> agent/web/showcase.js (additive section on
# the existing Role Showcase page, not a new page).

walkthrough_version: 1
last_updated: "2026-09-16"

intro: >-
  Three ways to walk through this project depending on what a conversation
  needs to cover. Each path links to real capabilities, real evidence, and
  a live surface where the concept can actually be shown, not just
  described. This is a personal/portfolio project -- these are engineering
  stories to learn and explain, not first-person employment claims.

deterministic_vs_llm:
  title: "What's deliberately deterministic vs. LLM-driven"
  summary: >-
    The LLM only investigates and proposes. Everything that decides whether
    a change is safe, whether it actually happened, and whether it's
    correct is deterministic code, not a model's self-report.
  points:
    - claim: "Eligibility / risk classification (Workbench)"
      mechanism: "Deterministic catalogue-pattern match + agent/risk_policy.py classify() -- defense-in-depth, two independent checks -- before any LLM call happens at all."
    - claim: "Human approval boundary"
      mechanism: "approve_edit/reject_edit are never exposed as an LLM-callable tool schema and never reachable via the dispatch table by any name -- verified by exact set-membership tests (agent/execution_tools.py), not a system-prompt instruction (see AEQ-003: a substring check here was a real bug, fixed)."
      evidence: "docs/ai/AI_ENGINEERING_QUALITY_LEDGER.yaml AEQ-003"
    - claim: "Whether the AI's own claim is grounded"
      mechanism: "A deterministic groundedness checker flags any file/fact the model claims but never actually retrieved through a real tool call -- the model is never trusted to self-report what it looked at."
    - claim: "Whether a change actually reached production"
      mechanism: "Independent, bounded-retry production content assertion against the real deployed app -- not the pipeline's own PASS/FAIL banner, not an HTTP 200 alone."
      evidence: "docs/ai/AI_ENGINEERING_QUALITY_LEDGER.yaml AEQ-009, AEQ-013"
    - claim: "Independent quality evaluation"
      mechanism: "A structurally separate qa-evaluator subagent re-verifies a change against real evidence -- the implementer is never allowed to certify its own work."
    - claim: "What test suite runs for a given change"
      mechanism: "Deterministic risk/blast-radius classification (agent/change_risk.py, agent/test_impact_analysis.py) with a fail-closed default for anything unrecognized -- never an LLM guessing what to test."

