# Source data for the /recruiters page (agent/web/recruiters.html).
#
# Hand-written, reviewed facts only. agent/publish_recruiters_page.py turns
# this file plus the three published snapshot JSONs (eval-results.json,
# triage-evidence.json, ask-codebase-examples.json) into
# agent/web/recruiters.json, and refuses to build if any link is broken or
# any posting quote is not a verbatim excerpt of the posting text captured on
# the access date.
#
# Rules for editing (owner decisions, 2026-10-06):
# - Never invent a fact, a year, a salary, a skill or a title. No salary and
#   no notice period appear anywhere on the page. No years-of-experience
#   figure and no degree year. The only calendar year in the profile is the
#   owner-confirmed "since early 2026" for the NRG AI team (2026-10-06).
# - No architect job title, for NRG or anyone else; the headline describes
#   the work ("AI solution architecture and engineering"), not a title.
# - Posting quotes are the posting's words, not claims about the owner. They
#   are the only text exempt from the forbidden-claims scan.
# - Every evidence link must be a live route, a pending-deploy route (served
#   on this branch, not yet in production) or a repository source file.

profile:
  name: Karthikeyan Devadoss
  headline: AI solution architecture and engineering
  location: Berlin
  work_mode: Remote-first, open to contract work
  languages: English (working language); German A1–A2
  education: B.E. Computer Science, Madras University
  nrg: >-
    Current client engagement: NRG Energy. Since early 2026 I have been one of
    a handful of engineers in NRG's initial core AI team, designing and
    building AI solutions hands-on alongside senior backend work, and taking
    part in architecture discussions and design decisions with the lead. The
    platform on this page is my own system, not an NRG product.
  facts_source: Confirmed by me on 2026-10-06 (headline, degree, languages, work mode, NRG wording and NRG AI team role); name, Berlin and the NRG separation also appear on the live home page.
  links:
    - {label: GitHub, url: "https://github.com/karthikdevadoss"}
    - {label: LinkedIn, url: "https://www.linkedin.com/in/karthikeyan-devdoss/"}
    - {label: Home page, url: "/"}

postings_accessed: "2026-10-06"
postings_note: >-
  Thirteen English-language AI engineering job postings that were listed as
  open on the access date, in this order: remote first, then Berlin hybrid, Berlin on-site and
  other German cities. Architect-titled roles based in Germany in the same
  search all required German; the one architect-titled role here is EU-remote.

