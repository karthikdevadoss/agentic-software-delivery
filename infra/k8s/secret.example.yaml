# TEMPLATE ONLY. Do not put real values in this file or commit a filled copy.
# Create the real Secret out-of-band, e.g.:
#   kubectl -n asd create secret generic asd-platform-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=OWNER_API_TOKEN="$OWNER_API_TOKEN"
# (kind: for real clusters prefer an external secret manager / sealed secrets.)
# Not applied by kustomization.yaml on purpose; the Deployment marks every key
# optional, so the pod starts (with AI features unavailable) without it.
apiVersion: v1
kind: Secret
metadata:
  name: asd-platform-secrets
  namespace: asd
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  OWNER_API_TOKEN: "REPLACE_ME"
  EVENT_LEDGER_DATABASE_URL: "REPLACE_ME"
