recommended_talking_points:
  - "The distinction between 'AI wrote code fast' and 'we built a measurable, auditable delivery process on top of a probabilistic system' — see docs/ai/AI_ENGINEERING_QUALITY_LEDGER.yaml's AEQ-013: the first genuine end-to-end AI backend delivery run surfaced 3 real bugs, each invisible to every existing mocked test, each found only by actually running the pipeline for real and independently cross-checking the result."
  - "A real production incident (AEQ-010): one idle-in-transaction Postgres connection froze an entire async service because synchronous DB calls ran directly on the event loop — root-caused via a direct pg_stat_activity query, not guessed, fixed with run_in_threadpool plus real statement/idle timeouts."
  - "Why 'AI does not certify its own work' is enforced architecturally, not just as a policy: approve/reject are never exposed as model-callable tools (verified by exact set-membership, not substring matching — itself a real bug found and fixed, AEQ-003), and a structurally separate qa-evaluator subagent independently re-verifies changes."
  - "A real Spring Boot 4 migration gotcha (AEQ-011): Flyway autoconfiguration silently split into its own module; three consecutive CI failures were root-caused only by decompiling the actual class bytecode to confirm it wasn't even on the classpath."
  - "A real Postgres-only production bug that a green H2 test suite could not have caught (AEQ-012): JPQL LOWER/CONCAT around a nullable bind parameter defaulted to bytea on Postgres — found via real Railway logs within minutes of a bad deploy, fixed, and locked in with a real Testcontainers regression test."

