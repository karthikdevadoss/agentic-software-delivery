# Test-only overrides layered on top of src/main/resources/application.properties.
# eureka.client.enabled=false: no real Eureka server runs during `mvn test`
# -- without this, every @SpringBootTest would waste real time on
# background registration attempts/retries against localhost:8761 (and
# risk log noise, the same real production lesson app/'s KafkaMessagingConfig
# documents for an unreachable Kafka broker).
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# BillingCustomerClientIntegrationTest's TestRestClientOverride replaces
# the real "loadBalancedCustomerRestClientBuilder" bean by the SAME name
# (not a differently-named @Primary bean -- see that test class's
# Javadoc for why), which needs Spring's bean-definition-overriding
# allowed. Off by default since Boot 2.1 for a real reason (silently
# overriding a bean is a common real source of hard-to-diagnose bugs) --
# scoped here to the test profile only, never production.
spring.main.allow-bean-definition-overriding=true
