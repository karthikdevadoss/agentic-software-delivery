# Test-only overrides layered on top of src/main/resources/application.properties.
# eureka.client.enabled=false: no real Eureka server runs during `mvn test`
# -- without this, every @SpringBootTest would waste real time on
# background registration attempts/retries against localhost:8761 (and
# risk log noise, the same real production lesson app/'s KafkaMessagingConfig
# documents for an unreachable Kafka broker).
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
