spring.application.name=billing-service
server.port=${PORT:8082}

spring.datasource.url=jdbc:h2:mem:billingservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# See services/api-gateway/application.properties for the full story:
# prefer-ip-address=true made local self-connections time out via the
# real LAN IP -- hostname=localhost is correct for a single-machine
# smoke test, not for a real multi-host deployment.
eureka.instance.hostname=localhost

# Same shared HMAC signing secret as every other service -- see
# docs/MICROSERVICES_ARCHITECTURE.md's Auth pattern section.
app.security.jwt.secret=${JWT_DEMO_SIGNING_SECRET:local-dev-only-insecure-demo-signing-secret-never-use-in-real-production-32-bytes-minimum}
app.security.jwt.issuer=agentic-delivery-customer-service-demo-issuer
app.security.jwt.audience=customer-service

# Real inter-service call target (see BillingCustomerClient +
# BillingCustomerClientConfig): "customer-service" is a logical Eureka
# service-id, resolved to a real instance by the @LoadBalanced RestClient
# at call time -- never a hardcoded host:port. Overridden in tests
# (@DynamicPropertySource) to point directly at a WireMock server instead.
customer-service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://customer-service}
# BL-015: real metering-to-billing integration.
metering-service.base-url=${METERING_SERVICE_BASE_URL:http://metering-service}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=false

app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
management.health.kafka.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.observations.key-values.application=billing-service
logging.structured.format.console=ecs
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
