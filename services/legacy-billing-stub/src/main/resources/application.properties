spring.application.name=legacy-billing-stub
# Matches billing-service's legacy-billing-system.base-url default
# (http://localhost:9099). PORT is what the real-topology harness sets.
server.port=${PORT:9099}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
