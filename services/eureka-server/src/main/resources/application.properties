spring.application.name=eureka-server
server.port=${PORT:8761}

# The registry does not register itself with itself, and does not fetch
# a registry from anywhere else -- it IS the registry.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health,info

# BL-036: structured JSON logging (Spring Boot's native support, no extra
# dependency), matching the same real, confirmed NRG-adjacent pairing
# (CloudWatch + Splunk) already applied to the other 5 services -- this
# was the one service that had been missed.
logging.structured.format.console=ecs
