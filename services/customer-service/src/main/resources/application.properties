spring.application.name=customer-service
server.port=${PORT:8081}

spring.datasource.url=jdbc:h2:mem:customerservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# See services/api-gateway/application.properties for the full story:
# prefer-ip-address=true made local self-connections time out via the
# real LAN IP -- hostname=localhost is correct for a single-machine
# smoke test, not for a real multi-host deployment.
eureka.instance.hostname=localhost

# Same signing secret as every other service (shared HMAC key) -- see
# docs/MICROSERVICES_ARCHITECTURE.md's Auth pattern section: each
# service independently validates JWTs, no central session.
app.security.jwt.secret=${JWT_DEMO_SIGNING_SECRET:local-dev-only-insecure-demo-signing-secret-never-use-in-real-production-32-bytes-minimum}
app.security.jwt.issuer=agentic-delivery-customer-service-demo-issuer
app.security.jwt.audience=customer-service
app.security.jwt.demo-token-ttl-seconds=900

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.observations.key-values.application=customer-service
logging.structured.format.console=ecs
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
