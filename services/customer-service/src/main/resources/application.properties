spring.application.name=customer-service
server.port=${PORT:8081}

spring.datasource.url=jdbc:h2:mem:customerservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# See services/api-gateway/application.properties for the full story:
# prefer-ip-address=true made local self-connections time out via the
# real LAN IP -- hostname=localhost is correct for a single-machine
# smoke test, not for a real multi-host deployment.
eureka.instance.hostname=localhost

# Auth pattern (docs/MICROSERVICES_ARCHITECTURE.md): each service independently
# validates JWTs, no central session. This service is the only token issuer.
# BL-046: RS256 -- validate with the issuer's PUBLIC key only (base64 X.509
# SubjectPublicKeyInfo). The default is a DEV-ONLY key pair whose private half
# is checked in for local/test signing (see customer-service). Real
# environments set JWT_PUBLIC_KEY (and the issuer sets JWT_DEMO_PRIVATE_KEY).
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}
# DEV-ONLY private key (base64 PKCS#8) -- INSECURE by design, labelled so; the
# only holder of a private key is this issuer. Override with JWT_DEMO_PRIVATE_KEY.
app.security.jwt.private-key=${JWT_DEMO_PRIVATE_KEY:}
app.security.jwt.key-id=dev-2026-09
app.security.jwt.issuer=agentic-delivery-customer-service-demo-issuer
app.security.jwt.audience=customer-service
app.security.jwt.demo-token-ttl-seconds=900

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.observations.key-values.application=customer-service
logging.structured.format.console=ecs
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
