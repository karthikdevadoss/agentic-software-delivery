spring.application.name=api-gateway
server.port=${PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# REAL BUG FOUND during the first genuine multi-service smoke test:
# prefer-ip-address=true registered every service under this machine's
# real LAN IP, which local firewall/network-profile rules blocked for
# self-connections even though it is the same machine -- every real
# inter-service call timed out ("Connect to http://192.168.x.x:PORT
# failed: Connection timed out") despite Eureka correctly resolving a
# real, healthy instance. hostname=localhost is the correct fix for
# every service running on one dev machine; a real multi-host deployment
# would go back to prefer-ip-address=true (or a real DNS name), never
# hardcode localhost for actual production.
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info,gateway
# BL-014: same real, in-process-only tracing pattern already proven in
# app/ and the other 4 services -- structured ECS logs carry a real
# trace_id/span_id per line, no external collector needed. The gateway is
# where a request-scoped trace should actually START.
management.tracing.sampling.probability=1.0
management.observations.key-values.application=api-gateway
logging.structured.format.console=ecs
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# BL-039: aggregator/BFF fan-out (see bff/DashboardAggregationService)
bff.per-call-timeout-ms=1500
bff.fan-out-threads=8
