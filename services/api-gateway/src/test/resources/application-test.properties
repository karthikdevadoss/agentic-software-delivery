# Test-only overrides layered on top of src/main/resources/application.properties.
# Same real reasoning as services/billing-service/src/test/resources/application-test.properties:
# eureka.client.enabled=false so `mvn test` never wastes real time on
# background registration attempts against a real localhost:8761 that
# doesn't exist during this build, and so that Spring Cloud LoadBalancer's
# SimpleDiscoveryClientAutoConfiguration (conditional on no other
# DiscoveryClient bean being present) activates instead -- that is what
# lets GatewayRoutingIntegrationTest point the gateway's real lb()
# routing filters at real WireMock servers via
# spring.cloud.discovery.client.simple.instances.<service>[0].uri, with
# zero changes to GatewayRoutesConfig itself (it is still resolving
# service ids through a real DiscoveryClient -- just a different real
# implementation of one than production's EurekaDiscoveryClient).
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
