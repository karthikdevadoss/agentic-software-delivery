spring.application.name=notification-service
server.port=${PORT:8083}

spring.datasource.url=jdbc:h2:mem:notificationservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# See services/api-gateway/application.properties for the full story:
# prefer-ip-address=true made local self-connections time out via the
# real LAN IP -- hostname=localhost is correct for a single-machine
# smoke test, not for a real multi-host deployment.
eureka.instance.hostname=localhost

app.security.jwt.secret=${JWT_DEMO_SIGNING_SECRET:local-dev-only-insecure-demo-signing-secret-never-use-in-real-production-32-bytes-minimum}
app.security.jwt.issuer=agentic-delivery-customer-service-demo-issuer
app.security.jwt.audience=customer-service

app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
management.health.kafka.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.observations.key-values.application=notification-service
logging.structured.format.console=ecs
