spring.application.name=metering-service
server.port=${PORT:8084}

spring.datasource.url=jdbc:h2:mem:meteringservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

app.security.jwt.secret=${JWT_DEMO_SIGNING_SECRET:local-dev-only-insecure-demo-signing-secret-never-use-in-real-production-32-bytes-minimum}
app.security.jwt.issuer=agentic-delivery-customer-service-demo-issuer
app.security.jwt.audience=customer-service

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
