# PRODUCTION PROFILE -- connects to the SAME real Postgres database the
# Customer App's own demo_identity table already lives in (same
# DATABASE_URL/USERNAME/PASSWORD env var names as that service's own
# application-postgres.properties, pointed at the same real database via
# this service's own Railway environment variables). This service never
# runs Flyway and never writes to that table (DemoIdentityRepository
# exposes no write method at all) -- the Customer App remains the sole
# owner of that schema/migration history.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
