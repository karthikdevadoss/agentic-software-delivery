spring.application.name=authserver
server.port=${PORT:9000}

# Local/test default: an isolated in-memory H2, seeded with the SAME demo
# personas the Customer App's own database has (see DemoDataSeeder) --
# this profile never touches the real shared Postgres database. Real
# production activates the postgres profile instead (see
# application-postgres.properties), reading the Customer App's real,
# already-seeded demo_identity table -- never re-seeding/duplicating it.
spring.datasource.url=jdbc:h2:mem:authserverdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.oauth2.issuer=${OAUTH2_ISSUER:http://localhost:9000}
app.oauth2.customer-app-redirect-uri=${CUSTOMER_APP_REDIRECT_URI:http://localhost:8080/login/oauth2/code/customer-app-web}
# Real bcrypt hash of the literal string "local-dev-only-insecure-demo-
# client-secret" (Spring AS's client-secret verification uses whichever
# single PasswordEncoder bean is registered app-wide -- a real BCryptPasswordEncoder
# here, so a {noop}-prefixed plaintext value fails verification; see
# DefaultSecurityConfig's passwordEncoder() bean and the integration test's
# own real bcrypt-hashed secret for the same reason).
app.oauth2.demo-api-client-secret=${DEMO_API_CLIENT_SECRET:$2a$10$m5VsPz9sR0OO1.UqaYyCAuZp70Uj2KvuUabffIW6GezTcivcs6dZi}

management.endpoints.web.exposure.include=health,info
