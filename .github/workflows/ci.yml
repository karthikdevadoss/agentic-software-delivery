name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-java:
    name: Customer App (Java/Spring, incl. real Postgres Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # GitHub-hosted ubuntu-latest runners have a Docker daemon available
      # by default, so PostgresFlywayIntegrationTest's real Testcontainers
      # Postgres container actually runs here -- unlike local development
      # on this project's current Windows machine, which has no Docker
      # installed (see docs/DECISIONS.md).
      - name: mvn test
        working-directory: app
        run: ./mvnw test -B

  agentic-platform-python:
    name: Agentic platform backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      # Scoped deliberately to the fully offline/mocked test modules (no
      # live Railway URL, no real Anthropic/Postgres credential needed) --
      # NOT yet the full agent/ suite. Several existing test files touch
      # live production infrastructure (the event ledger's real Postgres,
      # the deployed Customer/platform apps) using credentials this CI
      # job intentionally does not have, by design (see docs/DECISIONS.md
      # / the overnight session's coverage matrix: "full Python regression
      # in CI" is recorded as a real, not-yet-closed gap, not silently
      # skipped).
      - name: Python unit/contract tests (RAG/MCP/Evals vertical slice)
        working-directory: agent
        run: python -m unittest test_backend_rag_index test_mcp_server test_backend_planning test_eval_runner -v
      - name: Build the curated backend RAG index (needed by evals)
        working-directory: agent
        run: python backend_rag_index.py
      - name: RAG/MCP retrieval + routing evals (must meet recorded thresholds)
        working-directory: agent
        run: python eval_runner.py all

  agentic-platform-frontend:
    name: Agentic platform frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node frontend test harnesses
        working-directory: agent
        run: |
          node test_trainer_frontend.js
          node test_usage_frontend.js
          node test_learn_frontend.js
