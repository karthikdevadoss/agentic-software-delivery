name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-java:
    name: Customer App (Java/Spring, incl. real Postgres Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted ubuntu-latest runners have a Docker daemon available
      # by default, so PostgresFlywayIntegrationTest's real Testcontainers
      # Postgres container actually runs here -- unlike local development
      # on this project's current Windows machine, which has no Docker
      # installed (see docs/DECISIONS.md).
      # RA-1 (retro action 2026-09-20, wired 2026-09-22): the deterministic
      # STATIC gate -- file modes/shebangs and the twice-recurring "--"
      # inside an XML/HTML comment bug -- now BLOCKS CI. A rule written in
      # docs/LESSONS.md twice still recurred; a gate cannot be forgotten.
      - name: STATIC gate (file modes, XML/HTML comment "--")
        run: python agent/static_gate.py
      # BL-041: config-drift gate -- a property key present in one Spring
      # profile file but missing from another (the Owner's real NRG
      # stage-vs-prod incident class). Deterministic, blocking; the tree
      # was clean when wired (8/8 resource roots PASS on 2026-09-22).
      - name: CONFIG-DRIFT gate (Spring profile files)
        run: python agent/check_config_drift.py
      - name: mvn test
        working-directory: app
        run: ./mvnw test -B
      # Real build verification for app/Dockerfile: this dev machine has
      # no Docker installed (see docs/LESSONS.md), so this is the ONLY
      # place this Dockerfile is actually proven to build, not just
      # reasoned through. Deliberately gating (not continue-on-error) --
      # a Dockerfile that doesn't build is a real defect, not noise.
      - name: Build the Customer App Docker image (real, gating verification)
        working-directory: app
        run: docker build -t customer-app:ci .
      # OWASP dependency-check: rolled out INFORMATIONAL-ONLY first
      # (continue-on-error, no failBuildOnCVSS threshold set), same
      # pattern this workflow already uses for the Testing Architecture V1
      # verify-change step above -- a new security scan can have real
      # false-positive noise against transitive dependencies that aren't
      # actually exploitable in this app's context; prove it's not noisy
      # here before ever making it a hard gate, not the other way around.
      #
      # REAL, FIRST-RUN FINDING (2026-09-20, not yet fixed): NVD now
      # requires an API key for reliable CVE-database access (a real,
      # fairly recent NVD policy tightening, not a config mistake here)
      # -- without one this step fails with "Invalid API Key, length of
      # 0 too short" and cannot actually analyze anything. continue-on-error
      # is exactly why that failure doesn't block CI. Real next step (needs
      # the Owner, not something Claude can self-serve): get a free key at
      # https://nvd.nist.gov/developers/request-an-api-key, add it as the
      # GitHub Actions secret NVD_API_KEY, then this run line becomes:
      #   ./mvnw org.owasp:dependency-check-maven:13.0.0:check -B -DprettyPrint=true -Dnvd.api.key=${{ secrets.NVD_API_KEY }}
      - name: OWASP dependency-check (informational only, does not gate CI)
        working-directory: app
        continue-on-error: true
        run: ./mvnw org.owasp:dependency-check-maven:13.0.0:check -B -DprettyPrint=true
      # Job logs require authenticated access even on a public repo, which
      # blocked real diagnosis of a failure from outside an interactive
      # session. Workflow-command annotations, by contrast, are readable
      # from the public Checks API with no auth at all -- this makes any
      # future test failure here self-diagnosable without needing log
      # access, not just a one-off debugging aid.
      - name: Surface surefire failure details as annotations (only runs if tests failed)
        if: failure()
        working-directory: app
        shell: bash
        run: |
          # A prior version of this step grepped for "FAILED|ERROR", which
          # missed pure-assertion failures reported as "FAILURE!" (no literal
          # "FAILED" substring) -- parsing the authoritative "Tests run: X,
          # Failures: Y, Errors: Z" summary line is the only reliable way to
          # catch every real failure regardless of wording elsewhere in the file.
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            summary=$(grep -E "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+" "$f" | tail -1)
            if [ -n "$summary" ] && ! echo "$summary" | grep -qE "Failures: 0, Errors: 0"; then
              name=$(basename "$f" .txt)
              # The real exception sits behind a wall of Spring/JUnit
              # framework boilerplate frames before the first "Caused by:"
              # -- a plain head/tail excerpt is dominated by that
              # boilerplate and never reaches it. Print the summary line
              # plus every "Caused by:" line (with a little trailing
              # context each) instead, which is where the actual defect is.
              summary_line=$(grep -m1 "Tests run:" "$f")
              caused_by=$(grep -A3 "Caused by:" "$f" | tr '\n' ' ' | tr '\r' ' ' | head -c 5000)
              echo "::error title=${name}::${summary_line} ||| ${caused_by}"
            fi
          done

  agentic-platform-python:
    name: Agentic platform backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # verify_change.py --base needs real merge-base history against
          # origin/master, which a shallow (depth-1) checkout doesn't have.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      # Both RAG indexes are gitignored, build-derived data (see
      # .gitignore) -- a real bug found via this exact CI run: several
      # tests (the pre-existing test_semantic_search_invocable_through_mcp
      # and this session's own test_dangerous_query_text_does_not_gain_
      # privilege) implicitly assumed an index already existed on disk,
      # which was always true on a long-lived dev machine but false on a
      # genuinely fresh checkout -- exactly what CI is. Building both
      # indexes BEFORE running any test is the real fix (not loosening the
      # tests' assertions).
      - name: Build the whole-repo RAG index (needed by semantic_repository_search tests)
        working-directory: agent
        run: python rag_index.py
      - name: Build the curated backend RAG index (needed by search_project_context tests + evals)
        working-directory: agent
        run: python backend_rag_index.py
      # UPDATED 2026-09-25: this used to run 4 named modules and the comment
      # here recorded "full Python regression in CI" as a known-open gap. That
      # gap is now largely closed -- the runner below executes the full
      # hermetic set (42 modules, ~570 tests). Six modules remain excluded
      # because they genuinely require live infrastructure this job does not
      # and should not hold (real Postgres via DATABASE_URL, the deployed
      # Railway apps, a spawned web_server subprocess); the runner prints all
      # six with their individual reasons on every run, so the exclusion is
      # visible rather than silent. One further module (test_showcase_data) is
      # held back pending an Owner decision, also named by the runner.
      # 2026-09-25: was 4 named modules out of 51 real test files. Now the full
      # hermetic set (42 modules, ~570 tests) via an explicit runner rather than
      # `unittest discover`, for two measured reasons:
      #   1. `python -m unittest discover -p "test_*.py"` in agent/ runs for
      #      12+ minutes, prints no "Ran N tests" summary, and EXITS 0 -- a
      #      false green that would report success having completed nothing.
      #   2. test_impact_analysis.py and test_architect.py are SOURCE modules
      #      whose names merely start with test_; discover sweeps them in.
      # The runner asserts the result instead of trusting the exit code: it
      # fails if zero tests ran, if the count falls below a floor (suite
      # silently shrank), or if any test failed. It also fails if a new
      # test_*.py exists in agent/ that is in no declared bucket.
      - name: Python hermetic test suite (BLOCKING -- asserts tests really ran)
        working-directory: agent
        run: python ci_python_tests.py
      - name: RAG/MCP retrieval + routing evals (must meet recorded thresholds)
        working-directory: agent
        run: python eval_runner.py all
      # ADDITIVE ANNOTATION ONLY (docs/TESTING_ARCHITECTURE_V1.md's own
      # stated plan, tracked in docs/ACTION_QUEUE.json's TESTING-ARCH-V1-GAPS
      # item 3: wire verify_change.py in as an informational step first,
      # never a silent authoritative-gate swap). --dry-run means it only
      # classifies risk/blast-radius and prints the test-selection plan it
      # WOULD run -- it executes zero real tests and always exits 0, so
      # this step can never fail the build; the real gate above (mvn test
      # -B, unconditional) is unchanged. continue-on-error is a second,
      # belt-and-suspenders guard against any unexpected exception in the
      # tool itself still not blocking CI.
      - name: "Testing Architecture V1: verify-change plan (informational only, does not gate CI)"
        working-directory: .
        continue-on-error: true
        shell: bash
        run: |
          # On a pull_request event, actions/checkout only fetches the PR's
          # own merge ref, not origin/master -- fetch it explicitly so the
          # base diff below has a real ref to compare against in both the
          # push-to-master and pull_request cases.
          git fetch origin master:refs/remotes/origin/master || true
          python agent/verify_change.py --base origin/master --dry-run

  agentic-platform-frontend:
    name: Agentic platform frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Node frontend test harnesses
        working-directory: agent
        run: |
          node test_trainer_frontend.js
          node test_usage_frontend.js
          node test_learn_frontend.js

  # Real microservices decomposition (see docs/MICROSERVICES_ARCHITECTURE.md)
  # -- built alongside app/ (the monolith), not replacing it. Each service
  # is a fully independent Maven project (matches how they'd actually
  # deploy independently), so each gets its own matrix leg rather than one
  # job running all 6 sequentially -- a failure in one service's tests
  # shouldn't obscure whether the other 5 are still green. billing-service's
  # Redis-backed tests (disabledWithoutDocker=true, skip on the local dev
  # machine, see docs/MICROSERVICES_ARCHITECTURE.md's smoke-test section)
  # run for real here, same as app/'s own Testcontainers tests above.
  # ACT-014 / BL-024 (2026-09-20): eureka-server and api-gateway added --
  # previously excluded with zero tests, a real escaped defect an
  # independent qa-evaluator pass found retroactively re-verifying BL-007
  # (2 of the 5 architecturally central pieces its own acceptance criteria
  # named had no automated proof they even start, let alone route/register
  # correctly). See docs/ACTION_QUEUE.json's ACT-014.
  microservices:
    name: Microservices - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [customer-service, billing-service, notification-service, metering-service, eureka-server, api-gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: mvn test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw test -B
      # Same real reasoning as app/'s own failure-annotation step above:
      # job logs need repo-admin auth even on this public repo, workflow-
      # command annotations don't.
      - name: Surface surefire failure details as annotations (only runs if tests failed)
        if: failure()
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            summary=$(grep -E "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+" "$f" | tail -1)
            if [ -n "$summary" ] && ! echo "$summary" | grep -qE "Failures: 0, Errors: 0"; then
              name=$(basename "$f" .txt)
              summary_line=$(grep -m1 "Tests run:" "$f")
              caused_by=$(grep -A3 "Caused by:" "$f" | tr '\n' ' ' | tr '\r' ' ' | head -c 5000)
              echo "::error title=${{ matrix.service }}-${name}::${summary_line} ||| ${caused_by}"
            fi
          done

  # BL-025: wires BL-021's real-topology multi-instance tier
  # (services/real-topology-tests/run_real_topology_test.py) into CI --
  # deliberately its OWN job, not folded into the `microservices` matrix
  # above, since it starts and coordinates 4 real service processes
  # together rather than testing one service in isolation (see
  # docs/TESTING_ARCHITECTURE_V1.md's section T).
  #
  # INFORMATIONAL ONLY (continue-on-error: true), NOT a gating check --
  # same convention this workflow already uses for the OWASP scan and the
  # verify_change.py dry-run above, for the same real reason: this is
  # freshly wired in and not yet proven reliable in GitHub's actual
  # runner environment. REAL, HONEST FINDING from this session's own
  # local re-verification (2026-09-20, not simulated): re-running the
  # harness locally today, ahead of this CI wiring, found it no longer
  # reaches PASS -- it got through real service startup, real Eureka
  # registration, and real gateway-routing-readiness, then failed at the
  # POST /customers/{id}/plan step with a real 503 ("legacy billing
  # system unreachable"). Root cause: ACT-013 (built after BL-021's own
  # "3 consecutive clean runs" proof) made billing-service's
  # ContractPlanService.enroll() call a real LegacyBillingSystemClient
  # against legacy-billing-system.base-url (default http://localhost:9099
  # -- see services/billing-service/src/main/resources/application.properties),
  # which nothing in this harness's 4-process topology starts. This is a
  # real drift between two features built the same night, not a flake --
  # logged as its own action item (see docs/ACTION_QUEUE.json's ACT-015)
  # rather than silently patched here, since building a real
  # legacy-billing-system stub process and wiring it into the harness's
  # own process/port-offset/cleanup machinery is real new harness design,
  # outside BL-025's own SMALL, "CI wiring only" scope. Running this job
  # anyway (rather than skipping it) still has real value even while
  # RED: it exercises real multi-process startup/registration/routing on
  # GitHub's actual runner environment (the one thing this task could not
  # verify from a local sandboxed session -- CPU/memory headroom for 4
  # concurrent real JVMs is a genuinely open question, noted honestly
  # rather than assumed) and gives real, fresh failure evidence once
  # ACT-015 is fixed, at which point this step should become gating
  # (continue-on-error removed) as a deliberate follow-up decision, not a
  # silent default.
  real-topology:
    name: Real-topology multi-instance tier (BL-021/BL-025; GATING since BL-056)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            services/eureka-server/pom.xml
            services/customer-service/pom.xml
            services/billing-service/pom.xml
            services/api-gateway/pom.xml
            services/legacy-billing-stub/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      # Reuses the already-pinned `requests` dependency
      # (agent/requirements.txt) the harness itself relies on -- no new
      # dependency file introduced just for this job.
      - run: pip install -r agent/requirements.txt
      # --port-offset 10000 matches the exact value already proven
      # locally (docs/TESTING_ARCHITECTURE_V1.md section T: 3 consecutive
      # clean runs, ~103-124s each) -- avoids any theoretical collision
      # with another job's default ports without changing the harness
      # itself. Timeouts bumped above the harness's own 90s defaults: a
      # fresh GitHub-hosted runner has no warm JVM/dependency cache the
      # way this project's own dev machine normally does, and this
      # session's own local re-run (see the job-level comment above) saw
      # real service startup take well over 90s under real concurrent
      # CPU load -- a cold CI runner is a similarly real, not
      # theoretical, slow-start case.
      # BL-056 (2026-09-22): now a REAL GATE. continue-on-error was removed
      # after BL-038 fixed the ACT-015 regression (the legacy billing
      # stand-in is now part of the topology) and three consecutive clean
      # local runs were recorded the same night: 2026-09-22 ~20:03-20:10,
      # 20:10:58-20:13:14 and 20:13:14-20:15:13 UTC, each exit 0 with
      # enroll_plan 201 / get_plan 200 (services/real-topology-tests/logs/
      # run2_summary.json, run3_summary.json). The external trainer review
      # (2026-09-22) named the advisory-only status of this tier -- the one
      # that catches multi-instance bugs -- as a real blocker; ACT-018 (7).
      - name: Real-topology multi-instance test (gating)
        id: topology
        run: python services/real-topology-tests/run_real_topology_test.py --port-offset 10000 --startup-timeout 180 --registry-timeout 120
      # The step's own `outcome` is checked (not the job-level failure())
      # so the real per-service logs are uploaded whenever the harness fails.
      - name: Upload real per-service logs (only runs if the harness failed)
        if: steps.topology.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: real-topology-service-logs
          path: services/real-topology-tests/logs/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Playwright E2E -- NON-BLOCKING on purpose (2026-09-25).
  #
  # 13 real specs have existed and been maintained in e2e/ for some time and
  # have NEVER run in CI -- `grep playwright .github/workflows/ci.yml` returned
  # zero before this job. That is the cheapest untapped coverage in the repo,
  # and it is also the layer that catches the defect class the Owner reports
  # hitting most (UI bugs found by hand, not by a gate).
  #
  # It starts non-blocking because it has no CI track record: playwright.config.js
  # auto-starts `python agent/web_server.py` and waits for it, which works
  # locally but has never been exercised on a cold GitHub runner. Promoting a
  # job to blocking before knowing its real flake rate is how a team learns to
  # ignore red builds.
  #
  # PROMOTION CRITERION, so this cannot quietly stay non-blocking forever:
  # once it has run green on 5 consecutive master pushes, remove
  # `continue-on-error` and make it gating. If it is red or flaky instead, that
  # is a real finding to fix -- not a reason to delete the job.
  # ---------------------------------------------------------------------
  e2e-playwright:
    name: Playwright E2E (non-blocking, stability observation)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Install Playwright browser (chromium only -- the config's sole project)
        run: npx playwright install --with-deps chromium
      # The RAG indexes are gitignored build output; web_server.py needs them
      # present, exactly as the Python job above does.
      - name: Build RAG indexes (web_server depends on them)
        working-directory: agent
        run: |
          python rag_index.py
          python backend_rag_index.py
      - name: Run Playwright specs (config auto-starts web_server.py)
        id: pw
        run: npx playwright test --reporter=list
      - name: Upload Playwright traces on failure
        if: steps.pw.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Stability note
        if: always()
        run: |
          echo "Playwright outcome: ${{ steps.pw.outcome }}"
          echo "This job is NON-BLOCKING. Promote to gating after 5 consecutive"
          echo "green runs on master by removing continue-on-error."
