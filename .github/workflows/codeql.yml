name: CodeQL

# Base Architecture V3 Section 14: real static-analysis coverage this
# repository had none of before (confirmed: no spotbugs/checkstyle/sonar
# in app/pom.xml, no prior code-scanning workflow). Free for a public
# repository, GitHub-hosted (no new infrastructure), and purely additive
# -- runs independently of ci.yml, never blocks the real mvn test /
# deploy gates. Dependabot (.github/dependabot.yml, already configured)
# covers dependency vulnerabilities; CodeQL covers first-party source
# code (SQL injection, XSS, hardcoded credentials, and similar real
# vulnerability classes) -- a deliberately non-overlapping pair, not two
# tools doing the same job.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # weekly, matching dependabot.yml's cadence

jobs:
  analyze-java:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Explicit manual build, not autobuild: app/pom.xml lives in a
          # subdirectory, not the repo root, and autobuild's real first
          # run on this exact repo layout failed to see any source
          # (verified live: run 34999309094 -- Python and JS jobs in the
          # same run succeeded, only java-kotlin's autobuild-driven
          # analyze step failed) -- a documented, common CodeQL/Maven
          # subdirectory gotcha, not a hypothetical concern.
          build-mode: manual

      - name: Build app/ for CodeQL to trace
        working-directory: app
        run: ./mvnw -q -B compile

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  analyze-other:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
